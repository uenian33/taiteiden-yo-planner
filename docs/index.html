<style>
/* ============================================================
   TOKENS — Festarri M3 language, extended with a rank scale.
   Light is the Festarri canvas; dark is the Art Night purple.
   ============================================================ */
:root{
  --corner-xs:4px;--corner-s:6px;--corner-m:10px;--corner-l:12px;
  --corner-l-inc:14px;--corner-xl:18px;--corner-xl-inc:22px;--corner-full:999px;
  --ease-emphasized:cubic-bezier(.2,0,0,1);
  --ease-emph-decel:cubic-bezier(.05,.7,.1,1);
  --ease-emph-accel:cubic-bezier(.3,0,.8,.15);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --dur-short2:100ms;--dur-short3:150ms;--dur-short4:200ms;
  --dur-med1:250ms;--dur-med2:300ms;--dur-med4:400ms;--dur-long1:450ms;--dur-long2:500ms;
  --font:"Roboto Flex","Roboto","Helvetica Neue",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --elev-1:0 1px 2px rgba(41,28,67,.07),0 1px 3px 1px rgba(41,28,67,.05);
  --elev-2:0 2px 6px 2px rgba(41,28,67,.09),0 1px 2px rgba(41,28,67,.10);
  --elev-3:0 -4px 24px 4px rgba(41,28,67,.14),0 2px 4px rgba(41,28,67,.10);
  --tl-h:118px;

  --primary:#16637F;--on-primary:#FFFFFF;
  --primary-container:#C6EAFA;--on-primary-container:#123243;
  --surface:#FFFFFF;--on-surface:#291C43;
  --surface-container-low:#FAFAFA;--surface-container:#F5F5F6;
  --surface-container-high:#F0EFF2;--surface-container-highest:#EAE9ED;
  --on-surface-variant:#5A5563;
  --outline:#8B8595;--outline-variant:#E5E3EA;
  --inverse-surface:#291C43;--inverse-on-surface:#F3EEF8;--inverse-primary:#8DCFEC;
  --scrim:#291C43;
  --glass:rgba(255,255,255,.90);
  --c-visual-bg:#E7DEFD;--c-visual-ink:#63519E;
  --c-music-bg:#F9DBE3;--c-music-ink:#9F3463;
  --c-dance-bg:#D7E9FA;--c-dance-ink:#2E6288;
  --c-part-bg:#D6EFE4;--c-part-ink:#1F6B54;
  --c-lit-bg:#ECF7DB;--c-lit-ink:#4A6420;
  --c-theatre-bg:#FBE6CE;--c-theatre-ink:#8C561C;
  --c-film-bg:#DCE4F5;--c-film-ink:#3C4E7A;
  --r3:#D8117F;--r3-bg:#FBD9EC;
  --r2:#16637F;--r2-bg:#C6EAFA;
  --r1:#63519E;--r1-bg:#E7DEFD;
  --r0:#8B8595;--r0-bg:#EAE9ED;
  --warn-bg:#FBE6CE;--warn-ink:#8C561C;
  --tiles:none;--map-tint:rgba(41,28,67,0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#8DCFEC;--on-primary:#00344A;
  --primary-container:#C6EAFA;--on-primary-container:#123243;
  --surface:#211636;--on-surface:#EFE9F6;
  --surface-container-low:#291C43;--surface-container:#31234F;
  --surface-container-high:#3B2B5E;--surface-container-highest:#46356E;
  --on-surface-variant:#BFB6D0;
  --outline:#8E86A0;--outline-variant:#463A5E;
  --inverse-surface:#EFE9F6;--inverse-on-surface:#31234F;--inverse-primary:#16637F;
  --scrim:#000000;--glass:rgba(41,28,67,.86);
  --c-visual-bg:#3D3169;--c-visual-ink:#DCCFFA;
  --c-music-bg:#5A2740;--c-music-ink:#FBD3E0;
  --c-dance-bg:#1F4463;--c-dance-ink:#C9E4FA;
  --c-part-bg:#1B4A3D;--c-part-ink:#C3EBDC;
  --c-lit-bg:#3A4A20;--c-lit-ink:#DFF0BE;
  --c-theatre-bg:#5A3E1D;--c-theatre-ink:#FBDFBE;
  --c-film-bg:#2B3A63;--c-film-ink:#CBD8F5;
  --r3:#FF5FB4;--r3-bg:#5B1440;
  --r2:#8DCFEC;--r2-bg:#1F4463;
  --r1:#C0AEF5;--r1-bg:#3D3169;
  --r0:#8E86A0;--r0-bg:#3B2B5E;
  --warn-bg:#5A3E1D;--warn-ink:#FBDFBE;
  --tiles:none;--map-tint:rgba(33,22,54,.18);
}}
:root[data-theme="dark"]{
  --primary:#8DCFEC;--on-primary:#00344A;
  --primary-container:#C6EAFA;--on-primary-container:#123243;
  --surface:#211636;--on-surface:#EFE9F6;
  --surface-container-low:#291C43;--surface-container:#31234F;
  --surface-container-high:#3B2B5E;--surface-container-highest:#46356E;
  --on-surface-variant:#BFB6D0;
  --outline:#8E86A0;--outline-variant:#463A5E;
  --inverse-surface:#EFE9F6;--inverse-on-surface:#31234F;--inverse-primary:#16637F;
  --scrim:#000000;--glass:rgba(41,28,67,.86);
  --c-visual-bg:#3D3169;--c-visual-ink:#DCCFFA;
  --c-music-bg:#5A2740;--c-music-ink:#FBD3E0;
  --c-dance-bg:#1F4463;--c-dance-ink:#C9E4FA;
  --c-part-bg:#1B4A3D;--c-part-ink:#C3EBDC;
  --c-lit-bg:#3A4A20;--c-lit-ink:#DFF0BE;
  --c-theatre-bg:#5A3E1D;--c-theatre-ink:#FBDFBE;
  --c-film-bg:#2B3A63;--c-film-ink:#CBD8F5;
  --r3:#FF5FB4;--r3-bg:#5B1440;
  --r2:#8DCFEC;--r2-bg:#1F4463;
  --r1:#C0AEF5;--r1-bg:#3D3169;
  --r0:#8E86A0;--r0-bg:#3B2B5E;
  --warn-bg:#5A3E1D;--warn-ink:#FBDFBE;
  --tiles:none;--map-tint:rgba(33,22,54,.18);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
img{display:block;max-width:100%}

/* ============================================================
   SHELL — mobile is one column: map behind, sheet over it,
   timeline docked to the bottom. Desktop splits into rail + map.
   ============================================================ */
.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr}
.mapwrap{position:relative;grid-area:1/1;overflow:hidden;background:var(--surface-container-low)}
#map{position:absolute;inset:0;z-index:0}
#map .leaflet-tile-pane{filter:var(--tiles)}
.maptint{position:absolute;inset:0;z-index:399;pointer-events:none;background:var(--map-tint)}
.leaflet-container{background:var(--surface-container-low);font-family:var(--font)}
.leaflet-control-zoom{display:none}
.leaflet-bottom{margin-bottom:var(--tl-h)}
.leaflet-control-attribution{font-size:10px;background:var(--glass) !important;
  color:var(--on-surface-variant) !important;padding:1px 5px}
.leaflet-control-attribution a{color:var(--primary) !important}

/* ---- top chrome: one 42px row, nothing stacked on top of it ---- */
.topbar{position:absolute;z-index:500;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;gap:8px;align-items:center;pointer-events:none;height:42px}
.topbar>*{pointer-events:auto}
.pillrow{flex:1 1 auto;min-width:0;display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none;padding:7px 2px;margin:-7px -2px;
  -webkit-mask:linear-gradient(to right,#000 calc(100% - 18px),#0000);
  mask:linear-gradient(to right,#000 calc(100% - 18px),#0000)}
.pillrow::-webkit-scrollbar{display:none}
.pill{height:42px;padding:0 14px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  font:600 14px/20px var(--font);white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3),transform var(--dur-short4) var(--spring)}
.pill:active{transform:scale(.94)}
.pill svg{width:18px;height:18px;flex:0 0 18px}
.pill[data-active="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.pill .n{min-width:18px;height:18px;padding:0 5px;border-radius:var(--corner-full);
  background:var(--on-surface);color:var(--surface);font:700 11px/18px var(--font);text-align:center}
.pill[data-active="true"] .n{background:var(--on-primary-container);color:var(--primary-container)}
.circle-btn{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1);
  display:grid;place-items:center;cursor:pointer;font:800 12px/1 var(--mono);letter-spacing:-.3px;
  transition:transform var(--dur-short4) var(--spring),background var(--dur-short2)}
.circle-btn:active{transform:scale(.9)}
.circle-btn svg{width:20px;height:20px}

/* ---- base-map switch, second row, left side, clear of everything ---- */
.seg{position:absolute;z-index:500;left:12px;top:calc(62px + env(safe-area-inset-top));
  display:flex;padding:3px;border-radius:var(--corner-full);
  background:var(--glass);backdrop-filter:blur(12px);box-shadow:var(--elev-1)}
.seg button{border:0;background:none;cursor:pointer;height:30px;padding:0 12px;
  border-radius:var(--corner-full);color:var(--on-surface-variant);
  font:600 12px/16px var(--font);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  transition:background var(--dur-short3),color var(--dur-short3)}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}

/* ---- markers ---- */
.mk{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk[data-on="0"]{display:none}
.mk .bub{border-radius:var(--corner-full);display:grid;place-items:center;
  box-shadow:var(--elev-2);border:2px solid var(--surface);
  transition:transform var(--dur-med2) var(--spring)}
.mk .bub svg{width:60%;height:60%}
.mk .stem{width:2px;background:var(--surface);box-shadow:var(--elev-1)}
.mk-r3 .bub{width:38px;height:38px;background:var(--r3);color:#fff}
.mk-r3 .stem{height:9px}
.mk-r2 .bub{width:29px;height:29px;background:var(--r2);color:var(--surface)}
.mk-r2 .stem{height:7px}
.mk-r1 .bub{width:22px;height:22px;background:var(--r1);color:var(--surface)}
.mk-r1 .stem{height:6px}
.mk-r0 .bub{width:12px;height:12px;border-width:1.5px;background:var(--r0);opacity:.7}
.mk-r0 .bub svg,.mk-r0 .stem{display:none}
.mk .lab{margin-bottom:3px;order:-1;max-width:160px;padding:2px 7px;border-radius:var(--corner-s);
  background:var(--glass);backdrop-filter:blur(6px);box-shadow:var(--elev-1);
  color:var(--on-surface);font:700 10px/14px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-r1 .lab,.mk-r0 .lab{display:none}
#map:not([data-close="1"]) .mk-r2 .lab{display:none}
.mk.sel .bub{transform:scale(1.3)}
.mk.sel::after{content:"";position:absolute;left:50%;bottom:0;width:66px;height:66px;
  margin:0 0 -16px -33px;border-radius:50%;background:currentColor;opacity:.28;
  animation:ping 2.4s ease-out infinite;pointer-events:none;z-index:-1}
.mk-r3.sel{color:var(--r3)}.mk-r2.sel{color:var(--r2)}.mk-r1.sel{color:var(--r1)}
@keyframes ping{0%{transform:scale(.5);opacity:.38}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}
.planline{stroke-dasharray:2 7;stroke-linecap:round}

/* Bloom motion, from design/patterns/festarri-bloom-icons.html.
   Two grades, and the choice is not taste: bi-pop is one <use> and one
   scale and goes everywhere; the six staggered petals are the hero
   moment only, which here is the detail panel's own button. Running
   six staggered animations on every row of a list is the thing that
   rule exists against. */
@keyframes bi-pop      {0%{transform:scale(.72)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes bi-fade     {from{opacity:0}to{opacity:1}}
@keyframes bi-petal-in {from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bi-centre-in{from{transform:scale(0)}to{transform:none}}
.bi--sel{transform-box:view-box;transform-origin:12px 12px;
  animation:bi-pop var(--dur-med2) var(--ease-emph-decel) both}
.bi--unsel{animation:bi-fade var(--dur-short4) var(--ease-standard) both}
.bi--bloom>g,.bi--bloom>circle{transform-box:view-box;transform-origin:12px 12px}
.bi--bloom>g{animation:bi-petal-in 400ms var(--ease-emph-decel) both}
.bi--bloom>g:nth-child(2){animation-delay:40ms}
.bi--bloom>g:nth-child(3){animation-delay:80ms}
.bi--bloom>g:nth-child(4){animation-delay:120ms}
.bi--bloom>g:nth-child(5){animation-delay:160ms}
.bi--bloom>g:nth-child(6){animation-delay:200ms}
.bi--bloom>circle{animation:bi-centre-in var(--dur-med2) var(--ease-emph-decel) 260ms both}

/* ============================================================
   TIMELINE — fixed height, three fixed rows. Nothing here wraps.
   ============================================================ */
.timeline{position:absolute;z-index:520;left:0;right:0;bottom:0;
  background:var(--glass);backdrop-filter:blur(16px);
  border-top:1px solid var(--outline-variant);
  padding:6px 14px calc(6px + env(safe-area-inset-bottom))}
.tl-head{display:flex;align-items:center;gap:10px;height:34px}
.tl-clock{flex:0 0 auto;border:0;background:none;padding:0 2px;cursor:pointer;
  color:inherit;font:700 24px/26px var(--mono);letter-spacing:-1.2px}
.tl-clock[data-off="1"]{color:var(--primary)}
.tl-sub{flex:1 1 auto;min-width:0;color:var(--on-surface-variant);
  font:400 12px/16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-sub b{color:var(--on-surface);font-weight:700}
.tl-nudge{flex:0 0 auto;display:flex;gap:6px}
.tl-nudge button{width:30px;height:30px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);display:grid;place-items:center}
.tl-nudge button svg{width:16px;height:16px}
.tl-track{position:relative;height:44px;touch-action:none;cursor:ew-resize;user-select:none;
  margin-top:2px}
#tlsvg{display:block;width:100%;height:44px}
.tl-ticks{display:flex;justify-content:space-between;height:14px;
  color:var(--on-surface-variant);font:500 10px/14px var(--mono)}
#tlToggle svg{transition:transform var(--dur-med2) var(--ease-emphasized)}
#tlToggle[aria-expanded="false"] svg{transform:rotate(180deg)}
/* collapsed: the dock becomes a pill that still scrubs, and gives the list its space back */
.timeline[data-collapsed="1"]{
  left:auto;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom));
  border:1px solid var(--outline-variant);border-radius:var(--corner-full);
  padding:5px 7px 5px 15px;box-shadow:var(--elev-2)}
.timeline[data-collapsed="1"] .tl-sub,
.timeline[data-collapsed="1"] .tl-track,
.timeline[data-collapsed="1"] .tl-ticks{display:none}
.timeline[data-collapsed="1"] .tl-head{height:34px;gap:7px}
.timeline[data-collapsed="1"] .tl-clock{font-size:20px;line-height:22px}

/* ============================================================
   SHEET — the list, the detail and the plan all live here
   ============================================================ */
.sheet{position:absolute;z-index:510;left:0;right:0;top:0;height:100%;
  background:var(--surface);border-radius:var(--corner-xl) var(--corner-xl) 0 0;
  box-shadow:var(--elev-3);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(var(--y,62%));touch-action:none;
  transition:transform var(--dur-long2) var(--ease-emph-decel)}
.sheet.dragging{transition:none}
.grab{flex:0 0 auto;padding:0 16px 8px;cursor:grab;user-select:none}
.grab:active{cursor:grabbing}
.handle{height:22px;display:grid;place-items:center;padding-top:8px}
.handle i{width:36px;height:4px;border-radius:var(--corner-full);background:var(--outline-variant)}
.brand{display:flex;align-items:center;gap:10px;padding:0 2px 8px;
  color:var(--on-surface-variant);font:700 10px/14px var(--font);letter-spacing:1.15px;
  text-transform:uppercase}
.brand .bm{display:inline-flex;align-items:center;gap:6px;color:var(--primary)}
.brand .bm svg{width:17px;height:17px}
.brand .bt{margin-left:auto;display:inline-flex;align-items:center;gap:7px}
.brand .tylogo{width:20px;height:20px;flex:0 0 20px;background:currentColor;

.sheet-head{display:flex;align-items:center;gap:10px;min-height:38px}
.sheet-head .ht{flex:1;min-width:0}
.sheet-head b{display:block;font:800 20px/25px var(--font);letter-spacing:-.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head span{display:block;color:var(--on-surface-variant);font:400 12px/16px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .circle-btn{background:var(--surface-container);box-shadow:none;backdrop-filter:none;
  width:38px;height:38px;flex:0 0 38px}
.searchbar{display:flex;align-items:center;gap:9px;margin-top:8px;padding:0 12px;height:46px;
  border-radius:var(--corner-full);background:var(--surface-container)}
.searchbar>svg{width:19px;height:19px;flex:0 0 19px;color:var(--on-surface-variant)}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;color:inherit;
  font:500 15px/20px var(--font)}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar button{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container-highest);color:var(--on-surface-variant);
  display:grid;place-items:center}
.searchbar button svg{width:15px;height:15px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:0 14px calc(20px + var(--tl-h));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sbody.locked{overflow:hidden}

/* ---- list rows: image, rank badge on the image, then the facts ---- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:8px;cursor:pointer;text-align:left;
  border:0;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring),box-shadow var(--dur-short3);
  animation:in var(--dur-med4) var(--ease-emph-decel) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row:active{transform:scale(.985)}
.row.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.row .thumb{position:relative;width:66px;height:66px;flex:0 0 66px;border-radius:var(--corner-m);
  overflow:hidden;background:var(--surface-container-highest)}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .thumb .rkb{position:absolute;left:4px;top:4px;height:17px;padding:0 5px;border-radius:5px;
  background:var(--rk-ink);color:var(--surface);font:800 10px/17px var(--mono);
  display:inline-flex;align-items:center;gap:3px;box-shadow:var(--elev-1)}
.row .thumb .rkb svg{width:9px;height:9px}
.row .thumb .rkb[data-r="0"]{display:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font:700 15px/19px var(--font);letter-spacing:-.15px}
.row .txt .when{margin:3px 0 0;font:600 13px/17px var(--mono)}
.row .txt .where{margin:2px 0 0;display:flex;align-items:center;gap:6px;
  color:var(--on-surface-variant);font:400 13px/17px var(--font);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--cat-ink)}
.row .fav{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--cat-bg);color:var(--cat-ink);display:grid;place-items:center;
  transition:transform var(--dur-med2) var(--spring),background var(--dur-short2)}
.row .fav:active{transform:scale(.85)}
.row .fav svg{width:18px;height:18px}
.row .fav .f{display:none}
.row .fav[aria-pressed="true"]{background:var(--cat-ink);color:var(--surface)}
.row .fav[aria-pressed="true"] .f{display:block}
.row .fav[aria-pressed="true"] .o{display:none}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bdg{padding:2px 7px;border-radius:var(--corner-xs);font:700 10px/14px var(--font);letter-spacing:.3px}
.bdg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.bdg.rain{background:var(--c-dance-bg);color:var(--c-dance-ink)}
.bdg.live{background:var(--r3-bg);color:var(--r3)}
.bdg.gone{background:var(--surface-container-highest);color:var(--on-surface-variant)}
.bdg.door{background:var(--c-part-bg);color:var(--c-part-ink)}
.bdg.rare{background:var(--c-visual-bg);color:var(--c-visual-ink)}
.dflags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dflag{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;
  border-radius:var(--corner-full);font:700 12px/16px var(--font)}
.dflag svg{width:16px;height:16px;flex:0 0 16px}
.dflag.door{background:var(--c-part-bg);color:var(--c-part-ink)}
.dflag.rare{background:var(--c-visual-bg);color:var(--c-visual-ink)}
.bdg.sess{background:var(--surface-container-highest);color:var(--on-surface-variant);font-family:var(--mono)}

.group-h{display:flex;align-items:center;gap:8px;padding:16px 2px 8px}
.group-h i{width:9px;height:9px;border-radius:50%;background:var(--rk-ink)}
.group-h b{font:700 12px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.group-h span{color:var(--on-surface-variant);font:400 12px/16px var(--font)}
.empty{margin:28px 0;padding:30px 22px;text-align:center;border-radius:var(--corner-xl);
  background:var(--surface-container)}
.empty h3{margin:0 0 4px;font:700 17px/23px var(--font)}
.empty p{margin:0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}

/* ---- detail ---- */
.dhero{position:relative;margin:0 -14px 14px;height:172px;overflow:hidden;
  background:var(--surface-container)}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero .grad{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(20,12,34,.86),rgba(20,12,34,.15) 58%,rgba(20,12,34,0))}
.dhero .chips{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:var(--corner-s);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.chip.rank{background:var(--rk-ink);color:var(--surface)}
.chip.cat{background:var(--cat-bg);color:var(--cat-ink)}
.dtitle{margin:0;font:800 23px/28px var(--font);letter-spacing:-.6px;text-wrap:balance}
.dalt{margin:4px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font)}
.dmeta{margin:9px 0 0;color:var(--on-surface-variant);font:400 14px/20px var(--font);
  display:flex;align-items:flex-start;gap:8px}
.dmeta svg{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.dmeta b{color:var(--on-surface);font:700 14px/20px var(--mono)}
.why{margin:14px 0 0;padding:13px 14px;border-radius:var(--corner-l);
  background:var(--rk-bg);color:var(--on-surface)}
.why h4{margin:0 0 5px;color:var(--rk-ink);font:700 10px/14px var(--font);
  letter-spacing:1.1px;text-transform:uppercase}
.why p{margin:0;font:400 14px/21px var(--font)}
.dactions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-accent{flex:1 1 160px;height:48px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--primary-container);color:var(--on-primary-container);
  font:700 15px/20px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:border-radius var(--dur-short3) var(--spring),background var(--dur-short2)}
.btn-accent:active{border-radius:var(--corner-m)}
.btn-accent svg{width:19px;height:19px}
.btn-accent[aria-pressed="true"]{background:var(--rk-ink);color:var(--surface)}
.btn-tonal{flex:0 0 auto;height:48px;padding:0 18px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface-container);color:var(--on-surface);text-decoration:none;
  font:600 15px/20px var(--font);display:inline-flex;align-items:center;gap:8px}
.btn-tonal svg{width:18px;height:18px}
.dsec{margin-top:20px}
.dsec h3{margin:0 0 8px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.dsec p{margin:0;font:400 15px/23px var(--font);white-space:pre-wrap}
.desc{position:relative;overflow:hidden;max-height:92px;
  transition:max-height var(--dur-med4) var(--ease-emphasized)}
.desc.open{max-height:6000px}
.readmore{margin-top:8px;height:38px;padding:0 14px;border:0;border-radius:var(--corner-full);
  background:var(--surface-container);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font:600 14px/20px var(--font)}
.readmore svg{width:18px;height:18px;transition:transform var(--dur-med2) var(--ease-emphasized)}
.readmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.info{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.info+.info{border-top:1px solid var(--outline-variant)}
.info .ic{width:36px;height:36px;flex:0 0 36px;border-radius:var(--corner-full);
  background:var(--surface-container);display:grid;place-items:center}
.info .ic svg{width:18px;height:18px}
.info .tx{flex:1;min-width:0}
.info .tx b{display:block;font:600 14px/20px var(--font)}
.info .tx span{display:block;color:var(--on-surface-variant);font:400 13px/19px var(--font)}

/* ---- plan ---- */
.plan-item{position:relative;padding-left:26px}
.plan-item::before{content:"";position:absolute;left:11px;top:0;bottom:-8px;width:2px;
  background:var(--outline-variant)}
.plan-item:last-child::before{display:none}
.plan-item{padding-bottom:2px}
.plan-item .num{position:absolute;left:2px;top:24px;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  font:700 11px/1 var(--mono);z-index:1}
.at{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:6px 8px 6px 12px;
  border-radius:var(--corner-full);background:var(--rk-bg)}
.at .lb{color:var(--on-surface-variant);font:700 10px/14px var(--font);
  letter-spacing:.9px;text-transform:uppercase}
.at b{font:700 14px/18px var(--mono);min-width:46px;text-align:center}
.at button{width:28px;height:28px;flex:0 0 28px;border:0;border-radius:var(--corner-full);
  cursor:pointer;background:var(--surface);color:var(--on-surface);
  font:700 16px/1 var(--font);display:grid;place-items:center}
.at .hint{flex:1;min-width:0;text-align:right;color:var(--on-surface-variant);
  font:500 12px/16px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at.bad{background:var(--warn-bg)}.at.bad .hint{color:var(--warn-ink);font-family:var(--font);font-weight:700}
.leg{display:flex;align-items:center;gap:7px;padding:6px 0 6px 26px;
  color:var(--on-surface-variant);font:500 12px/16px var(--font)}
.leg svg{width:14px;height:14px;flex:0 0 14px}
.leg.bad{color:var(--warn-ink)}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{display:flex;gap:11px;align-items:flex-start;padding:12px;border:0;cursor:pointer;
  text-align:left;width:100%;background:var(--surface-container);border-radius:var(--corner-l);
  transition:transform var(--dur-short4) var(--spring)}
.preset:active{transform:scale(.985)}
.preset .pi{width:34px;height:34px;flex:0 0 34px;border-radius:var(--corner-m);
  display:grid;place-items:center;background:var(--rk-bg);color:var(--rk-ink)}
.preset .pi svg{width:18px;height:18px}
.preset .pt{flex:1;min-width:0}
.preset b{display:block;font:700 15px/20px var(--font)}
.preset span{display:block;margin-top:2px;color:var(--on-surface-variant);font:400 13px/18px var(--font)}

/* ---- overlays ---- */
.snack{position:fixed;left:16px;right:16px;bottom:calc(var(--tl-h) + 14px);z-index:900;
  padding:13px 8px 13px 16px;border-radius:var(--corner-l);
  background:var(--inverse-surface);color:var(--inverse-on-surface);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font:400 14px/20px var(--font);box-shadow:var(--elev-2);
  transform:translateY(16px);opacity:0;visibility:hidden;
  transition:transform var(--dur-med2) var(--ease-emph-decel),opacity var(--dur-short4),visibility var(--dur-med2)}
.snack.show{transform:none;opacity:1;visibility:visible}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;z-index:800;
  transition:opacity var(--dur-med2),visibility var(--dur-med2)}
.scrim.show{opacity:.4;visibility:visible}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:810;max-height:82%;
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:var(--corner-xl) var(--corner-xl) 0 0;transform:translateY(101%);
  opacity:0;visibility:hidden;pointer-events:none;box-shadow:var(--elev-3);
  transition:transform var(--dur-med4) var(--ease-emph-accel),
             opacity var(--dur-short3),visibility var(--dur-med4)}
.fsheet.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;
  transition:transform var(--dur-long2) var(--ease-emph-decel),opacity var(--dur-short3)}
.fsheet h2{margin:0;padding:8px 22px 4px;font:700 19px/25px var(--font);letter-spacing:-.4px}
.fbody{overflow-y:auto;padding:0 18px 12px;scrollbar-width:none}
.fbody::-webkit-scrollbar{display:none}
.fbody h3{margin:14px 0 9px;color:var(--on-surface-variant);
  font:700 11px/16px var(--font);letter-spacing:1.1px;text-transform:uppercase}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:2px}
.opt{height:40px;padding:0 15px;border:0;border-radius:var(--corner-full);cursor:pointer;
  background:var(--surface-container);font:600 14px/20px var(--font);
  display:inline-flex;align-items:center;gap:7px;
  transition:background var(--dur-short2),color var(--dur-short2)}
.opt .ck{width:0;overflow:hidden;transition:width var(--dur-short3) var(--ease-emphasized)}
.opt .ck svg{width:15px;height:15px}
.opt[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.opt[aria-pressed="true"] .ck{width:15px}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--sw,var(--outline))}
.ffoot{display:flex;gap:10px;padding:10px 18px calc(18px + env(safe-area-inset-bottom));align-items:center}
.btn-ghost{height:46px;padding:0 18px;border:0;border-radius:var(--corner-full);background:none;
  color:var(--on-surface-variant);cursor:pointer;font:600 14px/20px var(--font)}

/* ============================================================
   DESKTOP — the sheet stops being a sheet and becomes a rail
   ============================================================ */
@media (min-width:901px){
  .app{grid-template-columns:436px 1fr}
  .mapwrap{grid-area:1/2}
  .sheet{position:relative;grid-area:1/1;transform:none !important;height:100%;
    border-radius:0;box-shadow:none;border-right:1px solid var(--outline-variant);touch-action:auto}
  .grab{cursor:default;padding-top:calc(10px + env(safe-area-inset-top))}
  .handle{display:none}
  .sbody{overflow-y:auto !important;padding-bottom:24px}
  .dhero{margin-left:-14px;margin-right:-14px}
  .timeline{left:auto;width:calc(100% - 436px)}
  .timeline[data-collapsed="1"]{left:auto;right:24px;width:auto}
  .snack{left:auto;right:24px;width:340px;bottom:calc(var(--tl-h) + 24px)}
  .fsheet{left:auto;right:24px;bottom:calc(var(--tl-h) + 24px);width:410px;
    border-radius:var(--corner-xl);max-height:66%}
  .leaflet-control-zoom{display:block}
  .leaflet-top.leaflet-right{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>

 西贝柳斯高中女声合唱团，18:00 同校室内合唱团，18:30 室内合唱团 Carmia。免费、室内，而且就站在长颈鹿的终点线上——躲雨和占位一次解决。","i":"44695","eid":44695,"t":"Helsingin Urkukesän Taiteiden yön Kuorojen kavalkadi","te":"Helsinki Organ Summer: Night of the Arts Choir Cavalcade","s":1020,"e":1140,"tl":"17:00-19:00","n":0,"nn":0},{"v":"Suvilahti","ve":"Suvilahti","a":"Kaasutehtaankatu, 00540 Helsinki, Suomi","la":60.18629,"ln":24.97418,"c":"Dance","cs":["Kuvataide","Muu ohjelma","Ulkona","Ruoka & juoma","Sisällä","Valokuva","Installaatio / näyttely","Musiikki","Tanssi"],"r":2,"d":"Planet Suvilahti is a creative collective. It is formed by the permanent tenants of the Suvilahti cultural powerhouse and the Suvilahtelaiset ry, whose producers are Ossi Kajas and Krista Snabb.\n\nSince 2007, the collective has offered annual public events and activities. …","df":"Planet Suvilahti on luova kollektiivi. Sen muodostavat Suvilahden kulttuurivoimalan vakituiset vuokralaiset ja Suvilahtelaiset ry, jonka tuottajina toimivat Ossi Kajas ja Krista Snabb.\n\nVuodesta 2007 lähtien kollektiivi on tarjonnut vuosittain yleisötapahtumia ja aktiviteetteja. …","u":"https://helsinkifestival.fi/taiteidenyo/event/planet-suvilahti/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/planet-suvilahti-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/Planet-Suvilahti_banneri_1280x480-2-480x180.jpg?ver=892a54c0","io":"in","bk":0,"lim":0,"x":0,"op":1,"rr":0,"qe":"The annual collective open house of Suvilahti's resident artists and companies. Everything is free this year and it runs to midnight.","qf":"Suvilahden vakituisten toimijoiden vuotuinen yhteinen avoimien ovien ilta. Tänä vuonna kaikki on ilmaista ja ohjelma jatkuu keskiyöhön.","qz":"Suvilahti 常驻艺术家和团体的年度集体开放日。今年全部免费，开到午夜。","i":"42045","eid":42045,"t":"Planet Suvilahti","te":"Planet Suvilahti","s":1020,"e":1440,"tl":"17:00-00:00","n":0,"nn":0},{"v":"Öljysäiliö 468","ve":"Öljysäiliö 468","a":"Saaristolaivastonkatu 15, 00590 Helsinki, Suomi","la":60.16474,"ln":25.01248,"c":"Cinema","cs":["Muu ohjelma","Ulkona","Performanssi","Sisällä","Musiikki","Elokuva"],"r":2,"d":"Drifts Festival returns in August as the Unknown Territories series continues. We are bringing the festival to Oil Silo 468, a former industrial oil silo in Laajasalo. The festival will kick off on Thursday, the Night of the Arts, 20 August 2026, and the programme will run until 24 August. …","df":"Drifts-festivaali palaa elokuussa, kun Unknown Territories -sarja jatkuu. Tuomme festivaalin Öljysäiliö 468:aan, entiseen teolliseen öljysäiliöön Laajasalossa. Festivaali starttaa Taiteiden yönä torstaina. Ohjelmaa järjestetään myös 20.–24. …","u":"https://helsinkifestival.fi/taiteidenyo/event/drifts-festivaali/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/drifts-festival/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/postersmall-e1784877629750-480x328.png?ver=56f5c3ce","io":"in","bk":0,"lim":0,"x":0,"op":1,"rr":0,"qe":"The highest concentration of serious art tonight: Mikko Niemisto performance 17:00, two films 18:00 and 18:15, Tomoko Sauvage live 18:50, Laure Prouvost 19:50, Anna Pehrsson 20:20, Perila live 21:00 - inside a disused oil silo in Laajasalo. Going means giving the whole evening to it. It also runs until 24 August, so tonight is not your last chance.","qf":"Illan tihein vakavan taiteen keskittymä: Mikko Niemistön performanssi klo 17, kaksi elokuvaa 18.00 ja 18.15, Tomoko Sauvage live 18.50, Laure Prouvost 19.50, Anna Pehrsson 20.20 ja Perila live klo 21 — kaikki vanhassa öljysäiliössä Laajasalossa. Sinne lähteminen tarkoittaa koko illan antamista sille. Festivaali jatkuu myös 24. elokuuta asti, joten tämä ei ole viimeinen tilaisuus.","qz":"今晚严肃艺术密度最高的一处：17:00 Mikko Niemistö 表演，18:00 和 18:15 两部影像，18:50 Tomoko Sauvage 现场，19:50 Laure Prouvost，20:20 Anna Pehrsson，21:00 Perila 现场——全都在 Laajasalo 一个废弃油罐里。去了就等于把整晚交给它。而且它开到 8 月 24 日，今晚不是最后机会。","i":"40377","eid":40377,"t":"Drifts-festivaali","te":"Drifts Festival","s":1020,"e":1380,"tl":"17:00-23:00","n":0,"nn":0},{"v":"Amos Rex","ve":"Amos Rex","a":"Mannerheimintie 22-24, 00100 Helsinki, Suomi","la":60.17071,"ln":24.93653,"c":"Dance","cs":["Performanssi","Teatteri","Musiikki","Tanssi"],"r":2,"d":"sitting.waiting.walking . is an autofictional, multidisciplinary piece combining performance and installation that explores trauma, karma and human relationships. \n\nIt consists of eight acts, each of which invites young Nordic artists to help build and create a new performative situation. …","df":"Esityksen ja installaation yhdistävä sitting.waiting.walking. on autofiktiivinen ja monitaiteellinen teos, joka käsittelee traumaa, karmaa ja ihmissuhteita.\n\nTeos koostuu kahdeksasta näytöksestä: jokainen osa kutsuu mukaan nuoria pohjoismaisia taiteilijoita rakentamaan ja luomaan uuden esitystilante …","u":"https://helsinkifestival.fi/taiteidenyo/event/sitting-waiting-walking/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/sitting-waiting-walking-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/SWW-480x360.png?ver=eb368a05","io":"both","bk":1,"lim":0,"x":0,"op":0,"rr":1,"qe":"Two sittings, 17:00 and 20:00, each about two hours: autofiction, installation, dance and lip-sync on trauma and relationships. The problem is not that it is weak - it deserves the full two hours, and either sitting cuts the best block of the evening in half. Registration required.","qf":"Kaksi esitystä, klo 17 ja 20, kumpikin noin kaksi tuntia: autofiktiota, installaatiota, tanssia ja lipsynciä traumasta ja ihmissuhteista. Ongelma ei ole laatu vaan se, että teos ansaitsee koko kaksi tuntia — ja kumpi tahansa esitys halkaisee illan parhaan lohkon. Vaatii ennakkoilmoittautumisen.","qz":"两场，17:00 和 20:00，每场约两小时：自传体虚构、装置、舞蹈和对口型，讲创伤与关系。问题不是它不好，而是它值得完整看两小时，而任何一场都会把今晚最好的时间块切成两半。需要预约。","i":"39832.0","eid":39832,"t":"Sitting.waiting.walking.","te":"Sitting.waiting.walking.","s":1020,"e":1140,"tl":"17:00-19:00","n":1,"nn":2},{"v":"Helsingin kaupunginmuseo","ve":"Helsinki Ci ing are half the programme.","qf":"Teräksisen kaasukellon sisällä uusi esiintyjä joka tunti: naava 17, Paula K 18, Riekko 19, Korento 20, Milla Lehto 21 ja Nosara 22. Rakennuksen akustiikka on puolet ohjelmasta.","qz":"钢制煤气罐内部，每小时换人：17:00 naava，18:00 Paula K，19:00 Riekko，20:00 Korento，21:00 Milla Lehto，22:00 Nosara。这栋建筑的声学本身就是一半节目。","i":"46020","eid":46020,"t":"SÄILIÖ 2026","te":"SÄILIÖ 2026","s":1020,"e":1380,"tl":"17:00-23:00","n":0,"nn":0},{"v":"Musiikkitalo","ve":"Musiikkitalo","a":"Helsingin Musiikkitalo, 00100 Helsinki, Suomi","la":60.17361,"ln":24.935,"c":"Music","cs":["Ulkona","Musiikki"],"r":2,"d":"Experience classic orchestral works and an August evening – outdoor screening featuring concert recordings from Musiikkitalo.\n\nSit back on a picnic blanket and enjoy the summer evening to the sound of magnificent orchestral compositions. …","df":"Koe klassiset orkesteriteokset ja elokuinen ilta – ulkoilmanäytöksessä konserttitaltioinnit Musiikkitalosta.\n\nIstahda piknikviltille ja nauti kesäillasta loistokkaiden orkesterisävellysten soidessa. …","u":"https://helsinkifestival.fi/taiteidenyo/event/klassinen-piknik/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/classical-picnic/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/ulkokuvat_musiikkitalo_2019-09-04_david-jakob_web2400px_8-480x292.jpg?ver=34e459de","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"Concert recordings from the Finnish Radio Symphony, Helsinki Philharmonic and the Sibelius Academy on Musiikkitalo's media wall, watched from a blanket on the lawn. Free, all ages - and completely outdoors.","qf":"Radion sinfoniaorkesterin, Helsingin kaupunginorkesterin ja Sibelius-Akatemian konserttitallenteita Musiikkitalon mediaseinällä, katsottavaksi omalta viltiltä nurmikolta. Ilmainen ja kaikenikäisille — mutta täysin ulkona.","qz":"芬兰广播交响、赫尔辛基爱乐和西贝柳斯学院的音乐会录像投在音乐厅的媒体墙上，自带毯子坐草坪看。免费、全年龄——但完全露天。","i":"45608","eid":45608,"t":"Klassinen piknik","te":"Classical Picnic","s":1020,"e" ,"nn":0},{"v":"Cirko - Uuden Sirkuksen Keskus","ve":"Cirko - Center for New Circus","a":"Kaasutehtaankatu 1, 00540 Helsinki, Suomi","la":60.18683,"ln":24.97384,"c":"Cinema","cs":["Sirkus","Sisällä","Elokuva"],"r":1,"d":"A selection of outstanding international circus films will be screened in Maneesi at Cirko on the Night of the Arts. The programme is curated by producer and circus filmmaker Antti Suniala. …","df":"Cirko esittää Taiteiden yönä 20.8. Cirkon Maneesissa kansainvälisten sirkuselokuvien parhaimmistoa. Ohjelman on kuratoinut tuottaja ja sirkuselokuvaohjaaja Antti Suniala. Noin tunnin kestävä ohjelmisto esitetään kolmesti illan aikana ja tilaisuuteen voi saapua milloin vain. …","u":"https://helsinkifestival.fi/taiteidenyo/event/cirko-esittaa-sirkuselokuvien-ilta/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/cirko-presents-circus-film-night/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/Embers-Image-9-Photographer-Evan-Dux-480x270.jpg?ver=9134c943","io":"in","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"39025","eid":39025,"t":"Cirko esittää: Sirkuselokuvien ilta","te":"Cirko presents: Circus film night","s":1065,"e":1260,"tl":"17:45-21:00","n":0,"nn":0},{"v":"Teatteri ILMI Ö","ve":"Theatre ILMI Ö","a":"Tallberginkatu 1, 00180 Helsinki, Suomi (Kaapelitehdas)","la":60.16201,"ln":24.90408,"c":"Theatre","cs":["Nuorille","Lapsille","Luonto & ympäristö","Teatteri","Musiikki"],"r":0,"d":"Come grab a musical appetizer from Theatre ILMI Ö’s autumn premiere Kehä Ykkösen Muut – lauluja, tarinoita ja henkilökuvia kaupunkieläimistä . Free admission! A warm welcome to all!","df":"Tule nappaamaan musiikillinen alkupala Teatteri ILMI Ö:n syksyn ensi-illasta Kehä Ykkösen Muut – lauluja, tarinoita ja henkilökuvia kaupunkieläimistä.\n\nKehä ykkösen Muut on kiertävä musiikkiteatteriesitys, jossa näemme ja kuulemme hauskoja, jännittäviä ja surullisiakin tarinoita siitä, mitä tapahtuu …","u":"https://helsinkifestival.fi/taiteidenyo/event/teatteri-ilmi-o-jari-rattya-ja-keha-ykkosen-muut/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/theatre-ilmi-o-jari-rattya-ja-keha-ykkosen-muut/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/55304427096_aec425e34f_c1-e1785913104880-480x354.jpg?ver=57c82e9a","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"43897.1","eid":43897,"t":"Teatteri ILMI Ö: Jari Rättyä ja Kehä Ykkösen Muut","te":"Theatre ILMI Ö: Jari Rättyä ja Kehä Ykkösen Muut","s":1065,"e":1080,"tl":"17:45-18:00","n":2,"nn":3},{"v":"Kansalliskirjasto","ve":"The National Library of Finland","a":"Unioninkatu 36, 00170 Helsinki, Suomi","la":60.17035,"ln":24.95028,"c":"Dance","cs":["Performanssi","Sisällä","Musiikki","Tanssi"],"r":3,"d":"On the Night of the Arts, 20 August, the Tulkinnanvaraista forum(opens a new tab) – a cultural partner of the National Library of Finland – will bring to Cupola Hall a multi-sensory performance speculating on Jean Sibelius’s experimental music. …","df":"Kansalliskirjaston Kulttuurikumppani Tulkinnanvaraista-foorumi tuo Taiteiden yönä 20. elokuuta Kupolisaliin Jean Sibeliuksen kokeellisella musiikilla spekuloivan moniaistisen esityksen. …","u":"https://helsinkifestival.fi/taiteidenyo/event/kraftverk-tulkinnanvaraista/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/kraftverk-open-to-interpretation/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/kravtwerk_uusikuvat-480x300.jpg?ver=49c8992b","io":"in","bk":0,"lim":0,"x":0,"op":1,"rr":1,"qe":"The National Library's Cupola Hall is simply not open in the evening otherwise. Built on a letter Sibelius wrote in 1888 wondering whether musical vibration could power a city: Jupiter synth, narrator and dancers. The melodrama runs twice, 18:30 and 19:30; between and around it a three-hour electroacoustic installation you walk through. The door opens onto Senate Square, so the hand-off to the giraffes is perfect.","qf":"Kansalliskirjaston Kupolisali ei muuten ole illalla auki. Teos lähtee Sibeliuksen vuonna 1888 sedälleen kirjoittamasta kirjeestä, jossa hän pohtii voisiko musiikin värähtely toimia kaupungin voimanlähteenä: Jupiter-syntetisaattori, lausuja ja tanssijat. Melodramaattinen osuus esitetään kahdesti, 18.30 ja 19.30; ympärillä kolmituntinen elektroakustinen installaatio, jossa saa kävellä vapaasti. Ovesta ulos ja olet Senaatintorilla — vaihto kirahveihin on täydellinen.","qz":"国家图书馆的穹顶厅，平时晚上根本不开。作品取材自西贝柳斯 1888 年写给叔叔的一封信，他在信里琢磨音乐振动能不能给城市供电：Jupiter 合成器、朗诵者和舞者。朗诵剧演两次，18:30 和 19:30，前后是三小时的电声装置，可以自己在空间里走动。门开出去就是参议院广场，和长颈鹿的衔接完美。","i":"44688","eid":44688,"t":"Kraftverk - Tulkinnanvaraista","te":"Kraftverk - Open to Interpretation","s":1080,"e":1260,"tl":"18:00-21:00","n":0,"nn":0},{"v":"Temppeliaukion kirkko","ve":"Temppeliaukio Church","a":"Lutherinkatu 3, 00100 Helsinki, Suomi","la":60.17298,"ln":24.92526,"c":"Music","cs":["Avoimet ovet & kierrokset","Design & arkkitehtuuri","Musiikki"],"r":3,"d":"Come and celebrate The Night of the Arts at Temppeliaukio Church by joining our architecture themed tour combined with a musical experience!\n\nThe tour focuses on the details of the world-famous architecture of Temppeliaukio Church. …","df":"Tule viettämään Taiteiden yötä Temppeliaukion kirkkoon!\n\nTaiteiden yön tapahtumassamme pääset kuulemaan arkkitehtuuriteemaisen opastuksen ja tutustumaan tilan akustiikkaan musiikkielämyksen myötä.\n\nOpastuksessa pureudutaan Temppeliaukion kirkon ainutlaatuisen arkkitehtuurin yksityiskohtiin. …","u":"https://helsinkifestival.fi/taiteidenyo/event/arkkitehtuuria-ja-musiikkia-temppeliaukiolla/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/architecture-ja-music-at-temppeliaukio/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/AnnaTilli_Kirkkosali_2-480x360.jpg?ver=681f75c6","io":"both","bk":0,"lim":1,"x":0,"op":1,"rr":0,"qe":"Architecture tour of the rock church plus organ by cantor Pete Vuorio, 35 minutes. Of the three sittings only 18:00 (English) collides with neither the giraffes nor Nurmio. Limited seating, first come, no registration, doors about 20 minutes early, so 17:35 is the real deadline. In the evening the church is open only to people attending a session.","qf":"Arkkitehtuurikierros kalliokirkkoon ja kanttori Pete Vuorion urkumusiikkia, 35 minuuttia. Kolmesta esityksestä vain klo 18 englanninkielinen ei törmää kirahveihin eikä Nurmioon. Rajoitettu paikkamäärä, ei ennakkoilmoittautumista, ovet noin 20 minuuttia ennen — eli 17.35 on todellinen takaraja. Illalla kirkko on auki vain tapahtumaan tulijoille.","qz":"岩石教堂的建筑导览加上 Pete Vuorio 的管风琴，35 分钟。三场里只有 18:00 那场英语的既不撞长颈鹿也不撞 Nurmio。座位有限、先到先得、不预约，约提前 20 分钟开门，所以 17:35 到场是真正的截止线。当晚教堂只对参加活动的人开放。","i":"40302.0","eid":40302,"t":"Arkkitehtuuria ja musiikkia Temppeliaukiolla","te":"Architecture ja music at Temppeliaukio","s":1080,"e":1115,"tl":"18:00-18:35","n":1,"nn":3},{"v":"Asbestos Art Space","ve":"Asbestos Art Space","a":"Kristianinkatu 16, 00170 Helsinki, Suomi","la":60.17546,"ln":24.95527,"c":"Theatre","cs":["Galleria / museo","Performanssi","Musiikki"],"r":2,"d":"ASBESTOS ARS FESTIVAL V\n\nAugust 20–23, 2026 Asbestos Ars Festival, focusing on experimental music and performance art, is being held for the fifth time! The four-day festival features a program of experimental music and performing arts acts.\n\nPROGRAM:\n\nThursday, August 20, Night of the Arts, Asbesto …","df":"ASBESTOS ARS FESTIVAL V\n\n20.–23.8.2026\n\nKokeelliseen musiikkiin ja performanssiin keskittynyt Asbestos Ars Festival järjestetään jo viidettä kertaa! Neljä päivää kestävillä festareilla on ohjelmassa kokeellista musiikkia ja esittävän taiteen numeroita.\n\nOHJELMA:\n\ntorstai 20.8. …","u":"https://helsinkifestival.fi/taiteidenyo/event/asbestos-ars-festival-v/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/asbestos-ars-festival-v-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/asbsts_arsjuliste_page-0002-scaled-e1786377325296-480x269.jpg?ver=195e8b66","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Fifth edition, experimental music and performance art: doors 18:00, Milla-Maija Saari 18:45, Miradonna Sirkka 19:30, Laava 20:30. Free.","qf":"Viides kerta, kokeellista musiikkia ja esitystaidetta: ovet klo 18, Milla-Maija Saari 18.45, Miradonna Sirkka 19.30 ja Laava 20.30. Vapaa pääsy.","qz":"第五届，实验音乐与行为艺术：18:00 开门，18:45 Milla-Maija Saari，19:30 Miradonna Sirkka，20:30 Laava。免费。","i":"44665","eid":44665,"t":"Asbestos Ars Festival V","te":"Asbestos Ars Festival V","s":1080,"e":1305,"tl":"18:00-21:45","n":0,"nn":0},{"v":"Lapinlahden Lähde","ve":"Lapinlahden Lähde","a":"Lapinlahdenpolku 8, 00180 Helsinki, Suomi","la":60.16756,"ln":24.91353,"c":"Theatre","cs":["Ulkona","Performanssi","Osallistu"],"r":2,"d":"In Finnish mythology and folklore, “väki” refers to supernatural beings associated with a particular element, place or phenomenon, or to the supernatural power they embody.\n\nThis event brings these many and varied beings into the streets. …","df":"”Väki” tarkoittaa suomalaisessa mytologiassa ja kansanperinteessä tietyn asian tai ilmiön haltiaolentoja tai niiden yliluonnollista voimaa.\n\nTapahtuma marssittaa esiin nämä monenkirjavat olennot. …","u":"https://helsinkifestival.fi/taiteidenyo/event/vakea-kulkue-suomalaisen-mytologian-hahmot-heraavat-henkiin/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/vakea-procession-figures-from-finnish-mythology-come-to-life/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/HUKKA_kayta4-480x359.jpeg?ver=0af9dd44","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"The vaki of Finnish folklore - spirits, trolls, ancestral beings - walking out in procession, 15 to 20 minutes, with a mask workshop you can join first. It collides with Temppeliaukio at 18:00, and the organisers say outright it is cancelled in heavy rain.","qf":"Suomalaisen kansanuskon väki — haltiat, peikot, vainajahenget — astuu kulkueena kadulle 15–20 minuutiksi, ja mukaan voi liittyä tekemällä ensin oman naamion työpajassa. Törmää kuitenkin Temppeliaukion klo 18 esitykseen, ja järjestäjä sanoo suoraan että kova sade peruu koko jutun.","qz":"芬兰民间信仰里的 väki——精怪、山妖、祖灵——列队走出来，15 到 20 分钟，之前还可以先参加面具工作坊再加入队伍。但它和 18:00 的 Temppeliaukio 撞车，而且主办方直接写明大雨取消。","i":"42520","eid":42520,"t":"VÄKEÄ-kulkue: Suomalaisen mytologian hahmot heräävät henkiin","te":"VÄKEÄ procession: Figures from Finnish mythology come to life","s":1080,"e":1100,"tl":"18:00-18:20","n":0,"nn":0},{"v":"Katugalleria Mutteri","ve":"Katugalleria Mutteri","a":"Kirstinkatu 14, 00510 Helsinki, Suomi","la":60.18864,"ln":24.9464,"c":"Music","cs":["Musiikki"],"r":2,"d":"This pioneering Finnish punk band will perform on their home stage at Mutteri. The acoustic duo’s cajon-based sound reverberates like the firing of a cannon, imparting a sense of impending doom through the heavy use of drop-tuned guitar. …","df":"Kotimaisen puulaatikkopunkin pääjehut kotiareenallaan Mutterissa! Akustisen duon cajon paukkuu kuin kanuuna, kitara on viritetty liian matalalle ja ilmassa on vaaran tuntua. …","u":"https://helsinkifestival.fi/taiteidenyo/event/pahat-aanet-katugalleria-mutterissa/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/pahat-aanet-in-the-street-gallery-mutteri/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/IMG_2123-480x276.jpeg?ver=fbdc6b64","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Mutteri, a street gallery in Vallila, has strung six short sets across the evening (18:00, 18:30, 19:00, 20:00, 20:45, 21:21). Taken as a run they are the best side dish to the Konepaja route.","qf":"Vallilan Katugalleria Mutteri on ripustanut illan varrelle kuusi lyhyttä settiä (18.00, 18.30, 19.00, 20.00, 20.45 ja 21.21). Yhtenä sarjana ne ovat Konepaja-reitin paras lisuke.","qz":"Vallila 的街头画廊 Mutteri 今晚串了六段短演出（18:00、18:30、19:00、20:00、20:45、21:21）。整串连着看，是 Konepaja 路线最好的配菜。","i":"42183","eid":42183,"t":"Pahat äänet Katugalleria Mutterissa","te":"Pahat äänet in the Street Gallery Mutteri","s": nish history and a beloved master composer meet under the same roof on a summer night? …","df":"Säveliä ja sydämenlyöntejä Aino Acktén huvilalla. Mitä tapahtuu, kun Suomen historian valovoimaisin oopperadiva ja rakastettu säveltäjämestari kohtaavat kesäyössä, saman katon alla?\n\nTaiteiden yönä 20. elokuuta Aino Acktén huvila herää henkiin aivan erityisellä tavalla. …","u":"https://helsinkifestival.fi/taiteidenyo/event/emmy-achte-oskar-merikanto-etydi-kesayossa/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/emmy-achte-oskar-merikanto-etydi-kesayossa-an-etude-on-a-summer-night/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/d469c549-a766-463b-be45-f38f110b99c6-480x376.jpg?ver=5a051097","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"39008","eid":39008,"t":"Emmy Achté & Oskar Merikanto - Etydi kesäyössä","te":"Emmy Achté & Oskar Merikanto - Etydi kesäyössä - An étude on a summer night","s":1110,"e":1260,"tl":"18:30-21:00","n":0,"nn":0},{"v":"Rioni Erottaja","ve":"Rioni Erottaja","a":"Erottajankatu 2, 00120 Helsinki, Suomi","la":60.16562,"ln":24.94336,"c":"Music","cs":["Musiikki"],"r":0,"d":"Rioni Erottaja opens on August 19th, and the very next day we get to enjoy live music! Thursday, August 20th is the Night of the Arts, and to celebrate, The Night Sun will bring our restaurant to life with international classics, Georgian melodies, and their own original music. …","df":"Rioni Erottaja avataan 19.8. ja heti seuraavana päivänä pääsemme nauttimaan livemusiikista! Torstaina 20.8. on Taiteiden yö, ja sen kunniaksi The Night Sun herättää ravintolamme eloon kansainvälisillä klassikoilla, georgialaisilla sävelmillä sekä omalla tuotannollaan. …","u":"https://helsinkifestival.fi/taiteidenyo/event/the-night-sun-esiintyminen/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/the-night-sun-show/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/IG_1350-58-480x600.png?ver=c3e34545","io":"both","bk":0,"l at kind of emotions different movements – performed alone or with others, in or out of sync – arouse in us, and how passe …","df":"ALIEN on Taneli Törmän koreografioima pop up -tanssiesitys ja kunnianosoitus tanssille sekä rohkeudelle liikkua julkisissa tiloissa. Teos kysyy, mitä erilaiset liikkeet – yksin tai yhdessä, samaan tai eri tahtiin – herättävät meissä ja miten ohikulkijat reagoivat, kun tanssi astuu arjen keskelle.\n\nK …","u":"https://helsinkifestival.fi/taiteidenyo/event/alien/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/alien-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/ALIEN-e1781610858491-480x289.png?ver=ae91aa62","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"38130.1","eid":38130,"t":"ALIEN","te":"ALIEN","s":1120,"e":1160,"tl":"18:40-19:20","n":2,"nn":2},{"v":"Narinkkatori","ve":"Narinkkatori","a":"Narinkka 1, 00100 Helsinki, Suomi","la":60.1696,"ln":24.93378,"c":"Dance","cs":["Nuorille","Ulkona","Performanssi","Tanssi"],"r":0,"d":"Experience an energetic flash mob lasting about 10 minutes as Crew X dancers perform in Kalasatama. The performance is a greeting from KDC Dance Studio, whose new branch is opening in Kalasatama in August.","df":"Flash Mob – Energiaa Kalasatamaan!\n\nTule kokemaan noin 10 minuutin mittainen energinen flash mob, jossa osa Crew X -tanssijat tuovat vauhtia ja fiilistä Kalasatamaan! Esitys on KDC Dance Studion tervehdys. Uusi toimipiste avaa ovensa Kalasatamaan elokuussa.","u":"https://helsinkifestival.fi/taiteidenyo/event/kdc-dance-studio-narinkkatorilla/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/kdc-dance-studio-at-narinkkatori/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/KDC-LOGO-480x276.png?ver=cfbf69ac","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"43527.1","eid":43527,"t":"KDC Dance Studio Narinkkatorilla","te":"KDC Dance Studio at Narinkkatori","s":1125,"e":1135,"tl":"18:45-18:55","n":2,"nn":2},{"v":"Kulkue päättyy Senaatintorille","ve":"The procession ends at Senate Square","a":"Senaatintori, Helsinki, Suomi","la":60.16945,"ln":24.95228,"c":"Theatre","cs":["Nuorille","Ulkona","Performanssi","Lapsille","Sirkus","Teatteri","Musiikki"],"r":3,"d":"This Night of the Arts, giant giraffes take over the streets of Helsinki!\n\nThe astonishing animal operetta Les Girafes by the French theatre group Compagnie Off is a monumental street performance in the form of a parade, combining masterful giant puppetry, circus, burlesque, and opera.\n\nSuitable for …","df":"Tänä Taiteiden yönä jättiläiskirahvit valtaavat Helsingin kadut!\n\nRanskalaisen teatteriryhmä Compagnie Off:n hämmästyttävä eläinoperetti Les Girafes on kulkueen muotoon rakennettu monumentaalinen katuesitys, jossa yhdistyvät taidokas jättiläisnukketeatteri, sirkus, burleski ja oopperalaulu.\n\nKaikeni …","u":"https://helsinkifestival.fi/taiteidenyo/event/compagnie-off-les-girafes-elainoperetti/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/compagnie-off-les-girafes-the-animal-operetta/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/Les-Girafes-10_credit-Enzographe-480x319.jpg?ver=5251e915","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"The one irreplaceable thing tonight. Eight-metre magenta giraffe puppets from French company Compagnie Off, a parade of giant puppetry, circus and opera. Sets off around 19:00 at Keskuskatu x Pohjoisesplanadi, runs along Pohjoisesplanadi and turns up Unioninkatu into Senate Square for a ten-minute finale. The organisers say Senate Square is the place to stand (facing the cathedral); Pohjoisesplanadi gets crowded. Loud sound effects, not dog-friendly.","qf":"Illan ainoa korvaamaton teos. Ranskalaisen Compagnie Offin kahdeksanmetriset magentanväriset kirahvit yhdistävät jättinuket, sirkuksen ja oopperan kulkueeksi. Lähtö noin klo 19 Keskuskadun ja Pohjoisesplanadin risteyksestä, reitti Pohjoisesplanadia pitkin ja Unioninkadulta Senaatintorille, jossa noin kymmenen minuutin loppuhuipennus. Järjestäjän mukaan Senaatintorilta katsoo väljemmin (suunta kirkkoa kohti); Pohjoisesplanadille kertyy ruuhkaa. Kovia äänitehosteita, lemmikkejä ei suositella.","qz":"今晚唯一不可替代的东西。法国 Compagnie Off 的 8 米高洋红色长颈鹿巨偶，把巨型木偶、马戏和歌剧做成一场游行。约 19:00 从 Keskuskatu 与 Pohjoisesplanadi 路口出发，沿北埃斯普拉纳迪走，从 Unioninkatu 拐上参议院广场做约十分钟的压轴。主办方明说站参议院广场（面朝大教堂）才看得舒服，北埃斯普拉纳迪会挤。有强音效，不建议带狗。","i":"37917","eid":37917,"t":"Compagnie Off: Les Girafes - Eläinoperetti","te":"Compagnie Off: Les Girafes - The Animal Operetta","s":1140,"e":1200,"tl":"19:00-20:00","n":0,"nn":0},{"v":"Kallion kirkko","ve":"Kallio Church","a":"Itäinen Papinkatu 2, 00530 Helsinki, Suomi","la":60.18425,"ln":24.94934,"c":"Music","cs":["Musiikki"],"r":2,"d":"Helsinki Organ Summer culminates on the Night of the Arts, Thursday, August 20, with an organ marathon at Kallio Church and a choir cavalcade at Helsinki Cathedral. The organ marathon runs at Kallio Church from 7:00 PM to 11:00 PM. …","df":"Helsingin urkukesä huipentuu Taiteiden yönä torstaina 20.8. urkumaratoniin Kallion kirkossa ja kuorojen kavalkadiin Tuomiokirkossa. Urkumaraton soi Kallion kirkossa klo 19–23. Vohveli- ja makkarabuffet löytyy kirkon pihalta. …","u":"https://helsinkifestival.fi/taiteidenyo/event/helsingin-urkukesan-taiteiden-yon-urkumaraton/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/helsinki-organ-summers-night-of-the-arts-organ-marathon/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/Statokuva-1050x450-px-2026-08-20-Urkumaraton-480x206.png?ver=519bac1c","io":"both","bk":0,"lim":0,"x":0,"op":1,"rr":0,"qe":"Two organs, eight players, a new one every half hour until 23:00: Hintsala 19:00, Siimes 19:30, Hyry 20:00, Korpi 20:30, Pyylampi 21:00, Tamminen 21:30, Hartikainen 22:00, Moilanen 22:30. Waffles and sausages in the churchyard, and you can walk in and out at any point - the most forgiving high-quality thing on tonight's programme. The tower is also open until 22:00 for 10 EUR.","qf":"Kahdet urut, kahdeksan soittajaa, uusi puolen tunnin välein klo 23 asti: Hintsala 19.00, Siimes 19.30, Hyry 20.00, Korpi 20.30, Pyylampi 21.00, Tamminen 21.30, Hartikainen 22.00 ja Moilanen 22.30. Kirkon pihalla vohveli- ja makkarabuffet, ja sisään ja ulos saa kävellä milloin tahansa — illan anteeksiantavin laatuvalinta. Torniin pääsee klo 22 asti kympillä.","qz":"两台管风琴、八位演奏者，每半小时换人直到 23:00：19:00 Hintsala，19:30 Siimes，20:00 Hyry，20:30 Korpi，21:00 Pyylampi，21:30 Tamminen，22:00 Hartikainen，22:30 Moilanen。院子里有华夫饼和香肠，随时可以进出——今晚容错率最高的高质量项目。塔也开到 22:00，10 欧。","i":"44699","eid":44699,"t":"Helsingin Urkukesän Taiteiden yön Urkumaraton","te":"Helsinki Organ Summer's Night of the Arts Organ Marathon","s":1140,"e":1380,"tl":"19:00-23:00","n":0,"nn":0},{"v":"Kristuskirkko","ve":"Christ Church","a":"Apollonkatu 5, 00100 Helsinki, Suomi","la":60.17595,"ln":24.92653,"c":"Music","cs":["Musiikki"],"r":2,"d":"Audience members will instantly recognise the opening salvo of Bach’s Toccata, just one of about eleven such pieces that will feature in this special concert. Alongside Bach, attendees will be treated to works by composers such as Boëllmann and Widor. …","df":"Tidelii! Näin alkaa Bachin Toccata. Jokainen sen tietää. Tässä konsertissa kuullaan se ja kymmenkunta muuta Toccataa, Boëllmannin ja Widorin mukaan lukien. Toccatat ovat usein mahtipontisia ja meluisia, mutta ohjelmassa on myös muutamia hiljaisempia. …","u":"https://helsinkifestival.fi/taiteidenyo/event/toccata/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/toccata-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/Toccata-scaled-e1785744842494-480x394.jpg?ver=9a3118a2","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"The official listing has two sittings, 19:00 and 21:00 - not the 20:00 that went round in the press. Luut Klaver plays about eleven toccatas: Bach, plus Boellmann and Widor, with a few quiet pieces in between.","qf":"Virallisessa ohjelmassa on kaksi esitystä, klo 19 ja 21 — ei se klo 20, joka kiersi lehdissä. Luut Klaver soittaa noin yksitoista toccataa: Bachin lisäksi Boëllmannia ja Widoria, väliin muutama hiljaisempi.","qz":"官方节目单是 19:00 和 21:00 两场，不是媒体传的 20:00。Luut Klaver 弹大约十一首托卡塔：巴赫之外还有 Boëllmann 和 Widor，中间夹几首安静的。","i":"43413.0","eid":43413,"t":"TOCCATA!","te":"TOCCATA!","s":1140,"e":1200,"tl":"19:00-20:00","n":1,"nn":2},{"v":"Katugalleria Mutteri","ve":"Street Gallery Mutteri","a":"Kirstinkatu 14, 00510 Helsinki, Suomi","la":60.18864,"ln":24.9464,"c":"Music","cs":["Musiikki"],"r":2,"d":"A joint show by folk-ish artists Saana Kettu (vocals, piano) and Kaski Savuaa (guitar, vocals) featuring sorrowful grooves, moments of tear-rending joy and death rolled in honey. …","df":"Folkahtavien artistien Saana Kettu (laulu, piano) ja Kaski Savuaa (kitara, laulu) aminohappopäinen yhteisshow, jossa suru groovaa, ilo herkistyy ja kalma hunajoidaan. …","u":"https://helsinkifestival.fi/taiteidenyo/event/kettu-kaski-katugalleria-mutterissa/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/kettu-kaski-in-the-street-gallery-mutteri/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/IMG_2153-e1785309150200-480x294.jpeg?ver=64d4236b","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Third of Mutteri's six short sets.","qf":"Mutterin kuudesta setistä kolmas.","qz":"Mutteri 六连场之三。","i":"42195","eid":42195,"t":"Kettu & Kaski Katugalleria Mutterissa","te":"Kettu & Kaski in the Street Gallery Mutteri","s":1140,"e":1185,"tl":"19:00-19:45","n":0,"nn":0},{"v":"Tiivistämö","ve":"Tiivistämö","a":"Kaasutehtaankatu 1, 00540 Helsinki, Suomi","la":60.18698,"ln":24.97314,"c":"Music","cs":["Sisällä","Musiikki"],"r":2,"d":"7:00pm Vaskitsa\n\n8:15pm Viivi Rättyä\n\n9:30pm Pambikallio\n\nThe event is free and open to all ages! (Licensed bar area 18+)\n\nEver since their first release, Pambikallio has charmed audiences with their Finnish-language psychedelic pop. …","df":"Klo 19:00 Vaskitsa\n\nKlo 20:15 Viivi Rättyä\n\nKlo 21:30 Pambikallio\n\nT ":3,"d":"Come and celebrate The Night of the Arts at Temppeliaukio Church by joining our architecture themed tour combined with a musical experience!\n\nThe tour focuses on the details of the world-famous architecture of Temppeliaukio Church. …","df":"Tule viettämään Taiteiden yötä Temppeliaukion kirkkoon!\n\nTaiteiden yön tapahtumassamme pääset kuulemaan arkkitehtuuriteemaisen opastuksen ja tutustumaan tilan akustiikkaan musiikkielämyksen myötä.\n\nOpastuksessa pureudutaan Temppeliaukion kirkon ainutlaatuisen arkkitehtuurin yksityiskohtiin. …","u":"https://helsinkifestival.fi/taiteidenyo/event/arkkitehtuuria-ja-musiikkia-temppeliaukiolla/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/architecture-ja-music-at-temppeliaukio/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/AnnaTilli_Kirkkosali_2-480x360.jpg?ver=681f75c6","io":"both","bk":0,"lim":1,"x":0,"op":1,"rr":0,"qe":"Architecture tour of the rock church plus organ by cantor Pete Vuorio, 35 minutes. Of the three sittings only 18:00 (English) collides with neither the giraffes nor Nurmio. Limited seating, first come, no registration, doors about 20 minutes early, so 17:35 is the real deadline. In the evening the church is open only to people attending a session.","qf":"Arkkitehtuurikierros kalliokirkkoon ja kanttori Pete Vuorion urkumusiikkia, 35 minuuttia. Kolmesta esityksestä vain klo 18 englanninkielinen ei törmää kirahveihin eikä Nurmioon. Rajoitettu paikkamäärä, ei ennakkoilmoittautumista, ovet noin 20 minuuttia ennen — eli 17.35 on todellinen takaraja. Illalla kirkko on auki vain tapahtumaan tulijoille.","qz":"岩石教堂的建筑导览加上 Pete Vuorio 的管风琴，35 分钟。三场里只有 18:00 那场英语的既不撞长颈鹿也不撞 Nurmio。座位有限、先到先得、不预约，约提前 20 分钟开门，所以 17:35 到场是真正的截止线。当晚教堂只对参加活动的人开放。","i":"40302.1","eid":40302,"t":"Arkkitehtuuria ja musiikkia Temppeliaukiolla","te":"Architecture ja music at Temppeliaukio","s":1170,"e":1205,"tl":"19:30-20:05","n":2,"nn":3},{"v":"Svenska Teatern","ve":"Svenska Teatern","a":"Pohjoisesplanadi 2, 00

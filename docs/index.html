e":"Olarin Panimo","a":"Bruno Granholmin kuja 1, 00510 Helsinki, Suomi","la":60.19334,"ln":24.94791,"c":"Music","cs":["Musiikki"],"r":2,"d":"Möyhy-Veikot Drawing inspiration from the deeper chambers of the Temple of Lemminkäinen, this (this time three-member duo) feeds the mind with the most peculiar combinations. Tossed into the same stew are a dash of esoterica and AI-generated visual models. …","df":"Möyhy-Veikot\n\nLemminkäisen Temppelin syvemmän pään kammioista ammentava (tällä kertaa kolmihenkinen duo) ruokkii mieltä mitä erikoisimmilla yhdisteillä.\n\nSamaan liemeen sotketaan ripaus esoteriaa sekä keinoälygeneroituja visuaalisia malleja.\n\nTauskin kämpän interiööreistö, johon katsoja pääsee telep …","u":"https://helsinkifestival.fi/taiteidenyo/event/moyhy-veikot-dxxxa-d-hzzzt-olarin-panimolla/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/moyhy-veikot-dxxxa-d-hzzzt-at-olarin-panimo/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/MV-Kadulla_Promo-e1785399765768-480x364.jpg?ver=8029a790","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"The brewery inside Konepaja: Moyhy-Veikot plus Dxxxa D & Hzzzt, with an album and short film having their world premiere, running to 02:00.","qf":"Konepajan panimo: Möyhy-Veikot sekä Dxxxa D & Hzzzt, levyn ja lyhytelokuvan maailmanensi-ilta, klo kahteen asti.","qz":"Konepaja 里的那家酿酒厂：Möyhy-Veikot 加 Dxxxa D & Hzzzt，一张专辑和一部短片的世界首映，开到 02:00。","i":"42434","eid":42434,"t":"Möyhy-Veikot, Dxxxa D & Hzzzt Olarin Panimolla","te":"Möyhy-Veikot, Dxxxa D & Hzzzt at Olarin Panimo","s":1200,"e":1560,"tl":"20:00-02:00","n":0,"nn":0},{"v":"Katugalleria Mutteri","ve":"Street Gallery Mutteri","a":"Kirstinkatu 14, 00510 Helsinki, Suomi","la":60.18864,"ln":24.9464,"c":"Music","cs":["Musiikki"],"r":2,"d":"Vaikenemisen kulttuuri, the culture of silence, invites you in and promises that nothing will ever change. It tells you that everything is fine. It passes from one generation to the next. You can always count on it. It rejoices beside the cradle and accompanies the urn into the earth. …","df":"Vaikenemisen kulttuuri kutsuu mukaansa ja lupaa, ettei mikään muutu. Se kertoo, että kaikki on hyvin. Se kantaa sukupolvesta toiseen. Sen apuun voi aina luottaa. Se riemuitsee kehdon äärellä ja saattelee uurnan maahan. Se yhdistää ja erottaa, ylittää vastakkainasettelut. …","u":"https://helsinkifestival.fi/taiteidenyo/event/vaikenemisen-kulttuuri-katugalleria-mutterissa/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/vaikenemisen-kulttuuri-in-the-street-gallery-mutteri/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/IMG_2156-e1785309688646-480x362.jpeg?ver=0655265f","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Fourth of Mutteri's six short sets.","qf":"Mutterin kuudesta setistä neljäs.","qz":"Mutteri 六连场之四。","i":"42213","eid":42213,"t":"Vaikenemisen kulttuuri Katugalleria Mutterissa","te":"Vaikenemisen kulttuuri in the Street Gallery Mutteri","s":1200,"e":1230,"tl":"20:00-20:30","n":0,"nn":0},{"v":"Amos Andersons hem -kotimuseo","ve":"Amos Andersons hem -museum","a":"Yrjönkatu 27","la":60.16821,"ln":24.93747,"c":"Theatre","cs":["Galleria / museo","Performanssi","Sisällä","Musiikki"],"r":2,"d":"Three musicians will invite guests to Amos Anderson’s home and into their own inner worlds on the Night of the Arts. Maija Kauhanen, Anna-Sofia Anttonen and J-P Piirainen will improvise a number of soundscapes in various rooms of the home museum, with the audience welcome to explore the museum space …","df":"Soiva koti\n\nAmos Andersons hem\n\nTaiteiden yönä kolme muusikkoa kutsuu yleisön Amos Andersonin kotiin sekä heidän omiin sisäisiin maailmoihinsa. Maija Kauhanen, Anna-Sofia Anttonen ja J-P Piirainen luovat improvisoituja äänimaailmoja kotimuseon eri huoneissa, ja yleisön on mahdollista liikkua vapaast …","u":"https://helsinkifestival.fi/taiteidenyo/event/soiva-koti/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/music-at-home/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/0406235b-5204-4a16-afef-94a1ed0d2f7b-480x250.jpg?ver=6e605d87","io":"in","bk":0,"lim":0,"x":0,"op":1,"rr":0,"qe":"Three musicians improvising in different rooms of Amos Anderson's home museum while you wander between them and assemble your own version of the piece. The instruments are a kantele strung with LEDs, ceramic wind instruments and a guitele. Two sittings, 18:30 and 20:00, about 45 minutes each.","qf":"Kolme muusikkoa improvisoi Amos Andersonin kotimuseon eri huoneissa, ja yleisö kävelee huoneesta toiseen kooten oman versionsa teoksesta. Soittimina LED-valaistu kantele, keraamisia puhaltimia ja guitele. Kaksi esitystä, 18.30 ja 20.00, kumpikin noin 45 minuuttia.","qz":"三位乐手在 Amos Anderson 故居的不同房间里即兴，你在房间之间走动，自己拼出自己那一版作品。乐器是缀了 LED 的康特勒琴、陶制吹管和 guitele。两场，18:30 和 20:00，各约 45 分钟。","i":"40267.1","eid":40267,"t":"Soiva koti","te":"Music at home","s":1200,"e":1245,"tl":"20:00-20:45","n":2,"nn":2},{"v":"Teurastamo","ve":"Teurastamo","a":"Työpajankatu 2, 00580 Helsinki, Suomi","la":60.18983,"ln":24.97134,"c":"Cinema","cs":["Musiikki","Elokuva"],"r":2,"d":"The highly popular Night of Shorts will once again take place at Teurastamo on the Night of the Arts – and this year’s programme is probably our best ever! \n\nThis year, the event will very fittingly be opened by the Ykspihlajan Kino Orchestra, ushering the audience into the atmosphere of Finnish pop …","df":"Suuren suosion saavuttanut Lyhärien Yö järjestetään taas Teurastamolla Helsingin Taiteiden yönä – ja kattaus on ehkä kovempi kuin koskaan!\n\nTänä vuonna illan käynnistää itseoikeutetusti Ykspihlajan Kino-orkesteri, joka kuljettaa yleisön Suomi-iskelmien ja elokuvamusiikin tunnelmiin. …","u":"https://helsinkifestival.fi/taiteidenyo/event/lyharien-yo/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/night-of-shorts/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/IMG_2517-480x251.jpg?ver=9f921859","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Teurastamo's Night of Shorts, reportedly the strongest line-up they have had: Ykspihlajan Kino-orkesteri live at about 20:00, then this year's Jussi winner, an Oscar-shortlisted film and new shorts from BUFO and It's Alive, with the film-makers answering questions.","qf":"Teurastamon Lyhärien yö, kuulemma heidän vahvin ohjelmistonsa: Ykspihlajan Kino-orkesteri livenä noin klo 20, sitten tämän vuoden Jussi-voittaja, Oscar-esikarsintaan päässyt elokuva ja uusia lyhäreitä BUFOlta ja It's Alive Filmsiltä, tekijät vastaamassa kysymyksiin.","qz":"Teurastamo 的短片之夜，据说是他们办过阵容最强的一届：约 20:00 Ykspihlajan Kino-orkesteri 现场开场，然后是今年的 Jussi 奖得主、一部进过奥斯卡初选的片子，以及 BUFO 和 It's Alive 的新短片，导演现场答问。","i":"40320","eid":40320,"t":"Lyhärien yö","te":"Night of Shorts","s":1200,"e":1380,"tl":"20:00-23:00","n":0,"nn":0},{"v":"Kruunuvuorensilta","ve":"Kruunuvuorensilta","a":"Kruunuvuorensilta, Helsinki, Suomi","la":60.17394,"ln":25.00292,"c":"Music","cs":["Ulkona","Luonto & ympäristö","Musiikki"],"r":2,"d":"Eesa and Väinö Honkanen are two Helsinki-based indie artists known for their extraordinary gigs, including their performance at the highest natural point in Helsinki, a rock in the Kivikko outdoor park, on last year’s Night of the Arts. …","df":"Eesa ja Väinö Honkanen ovat helsinkiläisiä indieartisteja, jotka ovat tulleet tunnetuksi erikoisista keikkatempauksistaan, kuten viime vuoden Taiteiden yön konsertistaan Helsingin korkeimmalla luonnonmukaisella kohdalla Kivikon ulkoilupuiston kallioilla. …","u":"https://helsinkifestival.fi/taiteidenyo/event/eesa-vaino-honkanen-taiteiden-yon-parhaan-nakoalan-keikka/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/eesa-vaino-honkanen-the-night-of-the-arts-gig-with-the-best-views/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/Eesa-Vaino-Honkanen-Kruunuvuorensillalla-480x270.jpeg?ver=81ea0b1b","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Played from the seating deck at the middle of the brand-new Kruunuvuori Bridge with the Baltic and a late-summer sunset behind it. On its own merits it is wonderful - but it starts at 20:00 sharp and the giraffes do not finish until about then, and tonight brings 20 km/h wind and showers.","qf":"Soitetaan aivan uuden Kruunuvuorensillan keskivaiheen levähdystasanteelta, taustalla Itämeri ja loppukesän auringonlasku. Omillaan upea — mutta alkaa tasan klo 20, ja kirahvit loppuvat suunnilleen silloin, ja illassa on 20 km/h tuulta ja sadekuuroja.","qz":"在刚建成的 Kruunuvuorensilta 中段的休息平台上演出，背后是波罗的海和晚夏的天光。单独看非常好——但它 20:00 准时开始，而长颈鹿差不多要到那时才结束，今晚还有 20 km/h 的风和阵雨。","i":"40201","eid":40201,"t":"Eesa & Väinö Honkanen - Taiteiden yön parhaan näköalan keikka","te":"Eesa & Väinö Honkanen - The Night of the Arts gig with the best views","s":1200,"e":1260,"tl":"20:00-21:00","n":0,"nn":0},{"v":"Amos Rex","ve":"Amos Rex","a":"Mannerheimintie 22-24, 00100 Helsinki, Suomi","la":60.17071,"ln":24.93653,"c":"Dance","cs":["Performanssi","Teatteri","Musiikki","Tanssi"],"r":2,"d":"sitting.waiting.walking . is an autofictional, multidisciplinary piece combining performance and installation that explores trauma, karma and human relationships. \n\nIt consists of eight acts, each of which invites young Nordic artists to help build and create a new performative situation. …","df":"Esityksen ja installaation yhdistävä sitting.waiting.walking. on autofiktiivinen ja monitaiteellinen teos, joka käsittelee traumaa, karmaa ja ihmissuhteita.\n\nTeos koostuu kahdeksasta näytöksestä: jokainen osa kutsuu mukaan nuoria pohjoismaisia taiteilijoita rakentamaan ja luomaan uuden esitystilante …","u":"https://helsinkifestival.fi/taiteidenyo/event/sitting-waiting-walking/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/sitting-waiting-walking-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/SWW-480x360.png?ver=eb368a05","io":"both","bk":1,"lim":0,"x":0,"op":0,"rr":1,"qe":"Two sittings, 17:00 and 20:00, each about two hours: autofiction, installation, dance and lip-sync on trauma and relationships. The problem is not that it is weak - it deserves the full two hours, and either sitting cuts the best block of the evening in half. Registration required.","qf":"Kaksi esitystä, klo 17 ja 20, kumpikin noin kaksi tuntia: autofiktiota, installaatiota, tanssia ja lipsynciä traumasta ja ihmissuhteista. Ongelma ei ole laatu vaan se, että teos ansaitsee koko kaksi tuntia — ja kumpi tahansa esitys halkaisee illan parhaan lohkon. Vaatii ennakkoilmoittautumisen.","qz":"两场，17:00 和 20:00，每场约两小时：自传体虚构、装置、舞蹈和对口型，讲创伤与关系。问题不是它不好，而是它值得完整看两小时，而任何一场都会把今晚最好的时间块切成两半。需要预约。","i":"39832.1","eid":39832,"t":"Sitting.waiting.walking.","te":"Sitting.waiting.walking.","s":1200,"e":1320,"tl":"20:00-22:00","n":2,"nn":2},{"v":"Musiikkitalon terassi","ve":"The outdoor terrace of Musiikkitalo","a":"Mannerheimintie 13a, 00100 Helsinki, Suomi","la":60.17376,"ln":24.935,"c":"Music","cs":["Ulkona","Musiikki"],"r":2,"d":"Janne Masalin is an urban folk musician whose sharp lyrics break free from apathy, raise a toast from under the coffin lid and inspire and spread love. Masalin performs as a contemporary one-man band, featuring vocals and accordion, accompanied by machines and synthesisers and, at times, the powerfu …","df":"Janne Masalin ja uusi kuusipäinen kokoonpano Musiikkitalon terassilla.\n\nJanne Masalin on sanavalmis urbaani pelimanni, jonka teksteissä kuoriudutaan ulos apatiasta, skoolataan ruumisarkun kannen alta, rakastetaan ja rakastellaan. …","u":"https://helsinkifestival.fi/taiteidenyo/event/janne-masalin/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/janne-masalin-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/Janne-Masalin-1-C-Ida-Sofia-Fleming-480x321.jpg?ver=d6d616bc","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"Urban folk with accordion, synths and a six-voice ensemble on the Musiikkitalo terrace. It is a three-way choice with the Rhythm Caravan and Aizhan Sultan on Espa.","qf":"Urbaania folkia haitarilla, syntikoilla ja kuusihenkisellä lauluyhtyeellä Musiikkitalon terassilla. Kolmen kesken valinta Rhythm Caravanin ja Espan Aizhan Sultanin kanssa.","qz":"手风琴、合成器加六人合唱的都市民谣，在音乐厅露台。它和 Rhythm Caravan、Espa 的 Aizhan Sultan 是三选一。","i":"39243","eid":39243,"t":"Janne Masalin","te":"Janne Masalin","s":1200,"e":1260,"tl":"20:00-21:00","n":0,"nn":0},{"v":"Kolmensepänaukio","ve":"Kolmensepänaukio","a":"Mannerheimintie 1b, 00100 Helsinki, Suomi","la":60.16871,"ln":24.94081,"c":"Theatre","cs":["Ulkona","Performanssi","Musiikki"],"r":2,"d":"Arriving in their old school bus, the caravan will perform an irreverent rock’n’roll circus, featuring vintage cabaret aesthetics and a magnificent mix of colours. This riotous street musical brings a motley crew of characters to the stage to have a laugh and rock like there’s no tomorrow.","df":"The Most Fantastic Rhythm Caravan on häpeilemätön rock ’n’ roll -sirkus hunnutettuna vanhan liiton kabaree-estetiikkaan ja visuaaliseen väriloistoon. Tämä katumusikaalin irvikuva juoksuttaa lavalle monenkirjavia hahmoja, parodioi estottomasti päivänpolttavia teemoja ja rokkaa niin kuin huomista ei o …","u":"https://helsinkifestival.fi/taiteidenyo/event/the-most-fantastic-rhythm-caravan/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/the-most-fantastic-rhythm-caravan-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/04/3Y6A8835-2-480x320.jpg?ver=07456cc7","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"An old school bus rolls up and unloads a rock and roll circus - vintage cabaret, a cast of oddballs, a riotous street musical. It stands on Three Smiths Square outside Stockmann, 500 m from where the giraffes finish and 400 m from Nurmio at 21:00. The smoothest hand-off of the night.","qf":"Vanha koulubussi ajaa paikalle ja purkaa rock'n'roll-sirkuksen: vintage-kabareeta, joukko omalaatuisia hahmoja ja railakas katumusikaali. Kolmen sepän aukiolla Stockmannin edessä, 500 metriä kirahvien maalista ja 400 metriä Nurmiosta. Illan sujuvin vaihto.","qz":"一辆老校车开过来，卸下一场摇滚马戏——复古歌舞厅美学、一群怪角色、一出闹哄哄的街头音乐剧。地点在 Stockmann 门口的三铁匠广场，距长颈鹿终点 500 米，距 21:00 的 Nurmio 400 米。今晚衔接最顺的一段。","i":"37615","eid":37615,"t":"The Most Fantastic Rhythm Caravan","te":"The Most Fantastic Rhythm Caravan","s":1200,"e":1290,"tl":"20:00-21:30","n":0,"nn":0},{"v":"Espan lava","ve":"Espa Stage","a":"Eteläesplanadi 1, 00130 Helsinki, Suomi","la":60.16773,"ln":24.95027,"c":"Music","cs":["Ulkona","Musiikki"],"r":2,"d":"Two Helsinki-based musicians join forces in a captivating performance where cultures, histories, and soundscapes meet.\n\nThe collaboration between Aizhan Sultan (Kazakhstan) and Saku Liimatainen (Finland) creates a vibrant dialogue between modern Finnish and Kazakh folk music: ancient traditions enco …","df":"Kaksi helsinkiläistä muusikkoa yhdistää voimansa kiehtovassa esityksessä, jossa kulttuurit, historiat ja äänimaailmat kohtaavat.\n\nAizhan Sultanin (Kazakstan) ja Saku Liimataisen (Suomi) yhteistyö luo elävän vuoropuhelun modernin suomalaisen ja kazakstanilaisen kansanmusiikin välille: ikiaikaiset per …","u":"https://helsinkifestival.fi/taiteidenyo/event/aizhan-sultan-saku-liimatainen/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/aizhan-sultan-saku-liimatainen-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/20.8.-Aizhan-Sultan_kuva-Nikita-Gavrilenko-480x320.jpg?ver=ef193a7b","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Kazakh singer Aizhan Sultan and Finnish live-electronics musician Saku Liimatainen in dialogue: nomadic tradition against contemporary Finnish sound. Note the organisers moved this an hour earlier - it now starts at 20:00.","qf":"Kazakstanilainen laulaja Aizhan Sultan ja suomalainen live-elektroniikan tekijä Saku Liimatainen vuoropuhelussa: paimentolaisperinne vasten nykysuomalaista äänimaisemaa. Huomaa että järjestäjä aikaisti tätä tunnilla — alkaa nyt klo 20.","qz":"哈萨克歌手 Aizhan Sultan 和芬兰现场电子乐手 Saku Liimatainen 的对话：游牧传统对上当代芬兰声响。注意主办方把开演提前了一小时，现在是 20:00。","i":"45762","eid":457 Samba Sinestesia x Night of The Arts","s":1200,"e":1230,"tl":"20:00-20:30","n":2,"nn":2},{"v":"Nostage - Pieni taikahuone","ve":"Nostage - Pieni taikahuone","a":"Fredrikinkatu 49, 00100 Helsinki, Suomi","la":60.16664,"ln":24.93414,"c":"Participate","cs":["Muu ohjelma","Ulkona","Avoimet ovet & kierrokset"],"r":0,"d":"Oy Taikaministeriö Ab presents Pop-up Magic at the Nostage window. There will be three performances during the evening featuring magician Robert Jägerhorn. No pre-registration is required and admission is free. …","df":"Oy Taikaministeriö Ab esittää Pop-up taikuutta Nostagen ikkunalla illan aikana yhteensä kolme kertaa. Ikkunalla taikuri Robert Jägerhorn. Ei ennakkoilmoittautumisia, ei pääsymaksua. Tule katsomaan, kenties jopa osallistumaan! Koe live-taikuuden lumoava voima!","u":"https://helsinkifestival.fi/taiteidenyo/event/oy-taikaministerio-ab-esittaa-pop-up-taikuutta/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/oy-taikaministerio-ab-presents-pop-up-magic/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/IMG_0021-e1785490732696-480x365.jpeg?ver=21b9aae3","io":"out","bk":1,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"42823.2","eid":42823,"t":"Oy Taikaministeriö Ab esittää pop-up taikuutta","te":"Oy Taikaministeriö Ab presents: Pop-up Magic","s":1220,"e":1235,"tl":"20:20-20:35","n":3,"nn":3},{"v":"Töölönranta, Hesperianpuisto","ve":"Töölönranta, Hesperia Park","a":"Hesperianpuisto, Töölönranta Mannerheimintie 40 00260 Helsinki","la":60.17965,"ln":24.92997,"c":"Dance","cs":["Performanssi","Tanssi"],"r":2,"d":"ANIMA is a performance combining elements of contemporary dance, butoh and performance art. Anima refers to a spirit of the world that flows through all of us. The performance starts with a masked spirit carrying a light in the dark. …","df":"ANIMA on esitys, joka yhdistelee vaikutteita nykytanssista, butoh-tanssista ja performanssitaiteesta. Esityksen nimi viittaa maailman henkeen, joka virtaa kaiken olevaisen läpi. …","u":"https://helsinkifestival.fi/taiteidenyo/event/anima/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/anima-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/A960FA85-845F-43C9-B133-E01737A8186F-480x320.jpeg?ver=cc91935f","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Contemporary dance, butoh and performance art together: a masked spirit carrying a light out of the dark, on the shore at Toolonranta, 30 minutes.","qf":"Nykytanssia, butoa ja esitystaidetta yhdessä: naamioitu henki kantaa valoa pimeydestä. Töölönrannassa, 30 minuuttia.","qz":"现代舞、舞踏和行为艺术合在一起：一个戴面具的灵提着灯从黑暗里走出来。地点在 Töölönranta 海边，30 分钟。","i":"47217","eid":47217,"t":"ANIMA","te":"ANIMA","s":1230,"e":1260,"tl":"20:30-21:00","n":0,"nn":0},{"v":"Svenska Teatern","ve":"Svenska Teatern","a":"Pohjoisesplanadi 2, 00130 Helsinki, Suomi","la":60.16744,"ln":24.94316,"c":"Theatre","cs":["Avoimet harjoitukset","Puheohjelma","Teatteri","Sisällä"],"r":1,"d":"At the AMOS-stage we are currently rehearsing Marius von Mayenburg’s dark comedy Nattland. Come and see what a theatre rehearsal is like.\n\nThe rehearsals are free, but as the seats are limited book your free ticket in advance at svenskateatern.fi/eng","df":"AMOS-näyttämöllä harjoittelemme parhaillaan Marius von Mayenburgin mustaa komediaa Nattland Anna-Maria Lipposen ohjauksessa. Tule katsomaan, mitä harjoituksissa tapahtuu.\n\nSisäänpääsy on maksuton, mutta istumapaikkoja on rajoitetusti, joten varaa lippusi osoitteesta svenskateatern.fi/fi","u":"https://helsinkifestival.fi/taiteidenyo/event/nattland-esityksen-avoimet-harjoitukset/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/open-rehersals-of-nattland/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/KN26-kvadrat_07-nattland-e1785916729770-480x454.png?ver=bfc0f711","io":"in","bk":1,"lim":0,"x":0,"op":1,"rr":0,"qe":"","qf":"","qz":"","i":"43901.1","eid":43901,"t":"Nattland-esityksen avoimet harjoitukset","te":"Open rehersals of Nattland","s":1230,"e":1260,"tl":"20:30-21:00","n":2,"nn":2},{"v":"Kellariteatteri","ve":"Kellariteatteri","a":"Liisankatu 27, 00170 Helsinki, Suomi","la":60.17422,"ln":24.952,"c":"Dance","cs":["Teatteri","Sisällä","Musiikki","Tanssi"],"r":1,"d":"The musical improvisation theatre company Sointi will perform six brand-new premieres on the Night of the Arts marathon of mini-musicals! \n\nWith no idea of what will happen in the musicals, we will begin each performance by asking the audience to suggest a title and setting. …","df":"Musiikki-improvisaatioteatteri Sointi esittää kuuden ensi-illan verran uunituoreita kantaesityksiä Taiteiden yön minimusikaalimaratonissa!\n\nOlemme vuonna 2021 perustettu kollektiivi, jonka erikoisalaa ovat improvisoidut musikaalit. …","u":"https://helsinkifestival.fi/taiteidenyo/event/minimusikaalimaraton-kruununhaassa/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/marathon-of-mini-musicals-in-kruununhaka/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/Soinnin-kuvauspaiva21-480x320.jpg?ver=2b863e37","io":"in","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"39084.5","eid":39084,"t":"Minimusikaalimaraton Kruununhaassa","te":"Marathon of mini-musicals in Kruununhaka","s":1230,"e":1260,"tl":"20:30-21:00","n":6,"nn":6},{"v":"Lazy Fox Kallio","ve":"Lazy Fox Kallio","a":"Helsinginkatu 15, 00500 Helsinki, Suomi","la":60.18736,"ln":24.95498,"c":"Music","cs":["Musiikki"],"r":1,"d":"Lakanen Powerhouse revives the iconic sounds of the 1970s as the band takes on the catalog of the undisputed king of glam, Marc Bolan & T.Rex.\n\nThe centerpiece of the show is T.Rex’s legendary album Electric Warrior, packed with timeless riffs and a hypnotic boogie guaranteed to get your feet stompi …","df":"Lakanen Powerhouse herättelee henkiin 1970-luvun ikoniset soundit, kun bändi ottaa käsittelyynsä itseoikeutetun glam-kuninkaan, Marc Bolanin ja T.Rexin tuotannon.\n\nEsityksen keskiössä on T.Rexin legendaarinen Electric Warrior -albumi, jonka ajattomat riffit ja hypnoottinen boogie saavat jalat tamppa …","u":"https://helsinkifestival.fi/taiteidenyo/event/lakanen-powerhouse-plays-marc-bolan-t-rex/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/lakanen-powerhouse-plays-marc-bolan-t-rex-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/05/BolanGigPoster_TaiteidenYo_web-480x268.png?ver=3faa084c","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"37887","eid":37887,"t":"Lakanen Powerhouse plays Marc Bolan & T.Rex","te":"Lakanen Powerhouse plays Marc Bolan & T.Rex","s":1230,"e":1320,"tl":"20:30-22:00","n":0,"nn":0},{"v":"Vanha kirkkopuisto","ve":"Old Church Park","a":"Bulevardi 10, 00120 Helsinki, Suomi","la":60.16553,"ln":24.94085,"c":"Music","cs":["Ulkona","Musiikki"],"r":0,"d":"Raisu Poni is galloping on the lawn of Old Church Park! Playing music ranging from bossa nova to soft soul tones with a little prog detour, the band has been let out of their basement rehearsal space under the open sky to play for wanderers strolling in the summer evening.","df":"Vanhan kirkkopuiston nurmella laukkaa Raisu Poni! Bossanovasta pehmeisiin soulin säveliin pienen progemutkan kautta musisoiva bändi on päästetty ulos kellaritreenikämpästään avotaivaan alle soittelemaan kesäisessä illassa vaelteleville kulkijoille.","u":"https://helsinkifestival.fi/taiteidenyo/event/raisu-poni-on-taalla-taas/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/raisu-poni-is-back-again/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/IMG-20250518-WA00171-480x349.jpg?ver=2abe5450","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"","qf":"","qz":"","i":"44475","eid":44475,"t":"Raisu Poni on täällä taas!","te":"Raisu Poni is back again!","s":1230,"e":1290,"tl":"20:30-21:30","n":0,"nn":0},{"v":"Katugalleria Mutteri","ve":"Street Gallery Mutteri","a":"Kirstinkatu 14, 00510 Helsinki, Suomi","la":60.18864,"ln":24.9464,"c":"Music","cs":["Musiikki"],"r":2,"d":"Juha Rautio approaches music with a poetic instinct and a sense for the avant-garde. In recent years, he has played electric guitar as part of various acts, all united by an interest in improvisation and the traditions of experimental music.","df":"Juha Rautio lähestyy musiikkia runouden ja yleisen avantgardismin hattu kourassa. Viime vuosina Rautio on soittanut sähkökitaraa erilaisissa kokoonpanoissa, joita yhdistää kiinnostus improvisaatioon ja kokeellisen musiikin traditioihin.","u":"https://helsinkifestival.fi/taiteidenyo/event/juha-rautio-katugalleria-mutterissa/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/juha-rautio-in-the-street-gallery-mutteri/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/IMG_2157-480x310.jpeg?ver=127f3379","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Fifth of Mutteri's six short sets.","qf":"Mutterin kuudesta setistä viides.","qz":"Mutteri 六连场之五。","i":"42217","eid":42217,"t":"Juha Rautio Katugalleria Mutterissa","te":"Juha Rautio in the Street Gallery Mutteri","s":1245,"e":1275,"tl":"20:45-21:15","n":0,"nn":0},{"v":"Temppeliaukion kirkko","ve":"Temppeliaukio Church","a":"Lutherinkatu 3, 00100 Helsinki, Suomi","la":60.17298,"ln":24.92526,"c":"Music","cs":["Avoimet ovet & kierrokset","Design & arkkitehtuuri","Musiikki"],"r":3,"d":"Come and celebrate The Night of the Arts at Temppeliaukio Church by joining our architecture themed tour combined with a musical experience!\n\nThe tour focuses on the details of the world-famous architecture of Temppeliaukio Church. …","df":"Tule viettämään Taiteiden yötä Temppeliaukion kirkkoon!\n\nTaiteiden yön tapahtumassamme pääset kuulemaan arkkitehtuuriteemaisen opastuksen ja tutustumaan tilan akustiikkaan musiikkielämyksen myötä.\n\nOpastuksessa pureudutaan Temppeliaukion kirkon ainutlaatuisen arkkitehtuurin yksityiskohtiin. …","u":"https://helsinkifestival.fi/taiteidenyo/event/arkkitehtuuria-ja-musiikkia-temppeliaukiolla/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/architecture-ja-music-at-temppeliaukio/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/AnnaTilli_Kirkkosali_2-480x360.jpg?ver=681f75c6","io":"both","bk":0,"lim":1,"x":0,"op":1,"rr":0,"qe":"Architecture tour of the rock church plus organ by cantor Pete Vuorio, 35 minutes. Of the three sittings only 18:00 (English) collides with neither the giraffes nor Nurmio. Limited seating, first come, no registration, doors about 20 minutes early, so 17:35 is the real deadline. In the evening the church is open only to people attending a session.","qf":"Arkkitehtuurikierros kalliokirkkoon ja kanttori Pete Vuorion urkumusiikkia, 35 minuuttia. Kolmesta esityksestä vain klo 18 englanninkielinen ei törmää kirahveihin eikä Nurmioon. Rajoitettu paikkamäärä, ei ennakkoilmoittautumista, ovet noin 20 minuuttia ennen — eli 17.35 on todellinen takaraja. Illalla kirkko on auki vain tapahtumaan tulijoille.","qz":"岩石教堂的建筑导览加上 Pete Vuorio 的管风琴，35 分钟。三场里只有 18:00 那场英语的既不撞长颈鹿也不撞 Nurmio。座位有限、先到先得、不预约，约提前 20 分钟开门，所以 17:35 到场是真正的截止线。当晚教堂只对参加活动的人开放。","i":"40302.2","eid":40302,"t":"Arkkitehtuuria ja musiikkia Temppeliaukiolla","te":"Architecture ja music at Temppeliaukio","s":1260,"e":1295,"tl":"21:00-21:35","n":3,"nn":3},{"v":"Espan lava","ve":"Espa Stage","a":"Eteläesplanadi 1, 00130 Helsinki, Suomi","la":60.16773,"ln":24.95027,"c":"Music","cs":["Musiikki"],"r":3,"d":"A pioneer of Finnish rock music right in the heart of the city: this gig is guaranteed to be one of the highlights of the Night of the Arts!\n\nNurmio is one of the most respected musicians in Finnish rock and a living legend.","df":"Suomalaisen rockmusiikin uranuurtaja keskellä kaupunkia: tämä keikka on takuuvarmasti Taiteiden yön kärkitarjontaa!\n\nNurmio on yksi suomirockin arvostetuimmista muusikoista ja legenda jo eläessään.","u":"https://helsinkifestival.fi/taiteidenyo/event/tuomari-nurmio-luupaat/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/tuomari-nurmio-luupaat-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/20.8.-Tuomari-Nurmio_kuva-Perttu-Saksa-480x350.jpg?ver=852e6658","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"A living legend of Finnish rock, outdoors and free in the middle of town, one hour. 300 m from where the giraffes finish, which makes it the highest-value thing you can reach without moving.","qf":"Suomirockin elävä legenda, ilmaiseksi ulkoilmassa aivan keskustassa, tunnin verran. 300 metriä siitä, mihin kirahvit päättyvät — paras mitä ehdit ilman siirtymää.","qz":"芬兰摇滚的活化石，市中心露天免费，一小时。距长颈鹿终点只有 300 米——这是你不用移动就能接上的最高价值项目。","i":"45750","eid":45750,"t":"Tuomari Nurmio & Luupäät","te":"Tuomari Nurmio & Luupäät","s":1260,"e":1320,"tl":"21:00-22:00","n":0,"nn":0},{"v":"Esplanadi, Runebergin muistomekki & Senaatintori","ve":"Esplanadi, Statue of Runeberg & Senaatintori","a":"Esplanadi, Pohjoisesplanadi, 00130 Helsinki, Suomi","la":60.16745,"ln":24.94762,"c":"Dance","cs":["Nuorille","Ulkona","Performanssi","Osallistu","Teatteri","Tanssi"],"r":3,"d":"Landmarks is a public celebration by Helsinki’s Punking-Whacking community, centered on collaborative creation, the joy of dance and immersion and drawing inspiration from the environment. …","df":"Landmarks on Helsingin Punking-Whacking yhteisön julkinen iloittelu, jonka keskiössä ovat yhdessä luominen, tanssin ja eläytymisen nautinto sekä ympäristöstä inspiroituminen. …","u":"https://helsinkifestival.fi/taiteidenyo/event/landmarks/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/landmarks-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/night13-480x270.jpg?ver=f90a4147","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Two sittings: 21:00 by the Runeberg statue on Esplanadi, 22:00 on Senate Square. Helsinki's punking and whacking community turns the city's statues into living characters and pulls the audience in at the end. The 22:00 one costs almost no travel at all.","qf":"Kaksi esitystä: klo 21 Esplanadilla Runebergin patsaalla ja klo 22 Senaatintorilla. Helsingin punking- ja whacking-yhteisö herättää kaupungin patsaat henkiin ja vetää yleisön lopuksi mukaan. Klo 22 esitys ei maksa käytännössä mitään siirtymää.","qz":"两场：21:00 在埃斯普拉纳迪的 Runeberg 像旁，22:00 在参议院广场。赫尔辛基的 punking / whacking 群体把城市雕像变成活的角色，最后把观众也拉进去跳。22:00 那场几乎不需要任何交通。","i":"45712.0","eid":45712,"t":"Landmarks","te":"Landmarks","s":1260,"e":1290,"tl":"21:00-21:30","n":1,"nn":2},{"v":"Kristuskirkko","ve":"Christ Church","a":"Apollonkatu 5, 00100 Helsinki, Suomi","la":60.17595,"ln":24.92653,"c":"Music","cs":["Musiikki"],"r":2,"d":"Audience members will instantly recognise the opening salvo of Bach’s Toccata, just one of about eleven such pieces that will feature in this special concert. Alongside Bach, attendees will be treated to works by composers such as Boëllmann and Widor. …","df":"Tidelii! Näin alkaa Bachin Toccata. Jokainen sen tietää. Tässä konsertissa kuullaan se ja kymmenkunta muuta Toccataa, Boëllmannin ja Widorin mukaan lukien. Toccatat ovat usein mahtipontisia ja meluisia, mutta ohjelmassa on myös muutamia hiljaisempia. …","u":"https://helsinkifestival.fi/taiteidenyo/event/toccata/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/toccata-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/07/Toccata-scaled-e1785744842494-480x394.jpg?ver=9a3118a2","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"The official listing has two sittings, 19:00 and 21:00 - not the 20:00 that went round in the press. Luut Klaver plays about eleven toccatas: Bach, plus Boellmann and Widor, with a few quiet pieces in between.","qf":"Virallisessa ohjelmassa on kaksi esitystä, klo 19 ja 21 — ei se klo 20, joka kiersi lehdissä. Luut Klaver soittaa noin yksitoista toccataa: Bachin lisäksi Boëllmannia ja Widoria, väliin muutama hiljaisempi.","qz":"官方节目单是 19:00 和 21:00 两场，不是媒体传的 20:00。Luut Klaver 弹大约十一首托卡塔：巴赫之外还有 Boëllmann 和 Widor，中间夹几首安静的。","i":"43413.1","eid":43413,"t":"TOCCATA!","te":"TOCCATA!","s":1260,"e":1320,"tl":"21:00-22:00","n":2,"nn":2},{"v":"Dansbana! Amos Rex","ve":"Dansbana! Amos Rex","a":"Mannerheimintie 22-24, 00100 Helsinki, Suomi","la":60.17021,"ln":24.93615,"c":"Dance","cs":["Ulkona","Performanssi","Musiikki","Tanssi"],"r":2,"d":"Submit your body to the late summer melancholy.\n\nRest in Rave is a participatory dance performance at Dansbana! (Lasipalatsi Square). No dance skills needed. Let out your inner goth. Join us.\n\nOrganiser: Enemmän Collective (@enemmanenemman)","df":"Heittäydy loppukesän melankoliaan.\n\nRest in Rave on osallistava tanssiesitys Dansbana!-tanssilavalla (Lasipalatsinaukiolla). Tanssitaitoja ei tarvita. Päästä sisäinen goottisi valloilleen. Tule mukaan!\n\nJärjestäjä: Enemmän Collective ( @enemmanenemman )","u":"https://helsinkifestival.fi/taiteidenyo/event/rest-in-rave/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/rest-in-rave-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/IMG_20260815_124504-480x321.jpg?ver=f1ed73e4","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":0,"qe":"A participatory dance piece on the Dansbana stage at Lasipalatsi - no dance skills required, the theme is late-summer melancholy. It clashes with Nurmio but sits 400 m away.","qf":"Osallistava tanssiteos Lasipalatsin Dansbana-lavalla — tanssitaitoa ei tarvita, teemana loppukesän melankolia. Menee päällekkäin Nurmion kanssa mutta on 400 metrin päässä.","qz":"Lasipalatsi 的 Dansbana 舞台上的参与式舞蹈——不需要任何舞蹈基础，主题是晚夏的忧郁。和 Nurmio 撞车，但只隔 400 米。","i":"46752","eid":46752,"t":"Rest in Rave","te":"Rest in Rave","s":1260,"e":1320,"tl":"21:00-22:00","n":0,"nn":0},{"v":"Parrulaituri, Big-Be Hide, Kalasatama","ve":"Parrulaituri, Big-Be Hide, Kalasatama","a":"Parrulaituri 4, 00540 Helsinki, Suomi","la":60.1844,"ln":24.97671,"c":"Dance","cs":["Ulkona","Musiikki","Tanssi"],"r":2,"d":"Re-Charge\n\nRe-Charge is an electrifying bodily catalogue for alternative energy production. Re-Charge charges from love, for love.\n\nIt is part of a larger project Charge, that takes place in various neighbourhoods and communities as performances, workshops, encounters. …","df":"Re-Charge on kihelmöivä ja räjähtelevä ruumiillinen katalogi vaihtoehtoiselle energiantuotannolle. Re-Charge latautuu rakkaudesta ja rakkaudelle. Teos on osa laajempaa Charge-hanketta, joka tapahtuu teoksina ja työpajoina julkisissa tiloissa ja paikallisissa yhteisöissä. …","u":"https://helsinkifestival.fi/taiteidenyo/event/re-charge/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/re-charge-2/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/06/4-Loimaala_Charge_CC-2.9-Re-Charge-markkinointi-480x270.jpg?ver=688a5a0a","io":"out","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Site-specific dance on the Kalasatama quay, 45 minutes, with music running from techno and drum and bass to amapiano, plus live percussion. Outdoors, at the hour tonight's rain risk peaks.","qf":"Paikkasidonnaista tanssia Kalasataman laiturilla, 45 minuuttia, musiikki teknosta ja drum and bassista amapianoon, mukana live-lyömäsoittimet. Ulkona, ja juuri sinä tuntina jolloin sateen todennäköisyys on illan korkein.","qz":"Kalasatama 码头上的场域特定舞蹈，45 分钟，音乐从 techno、drum and bass 到 amapiano，还有现场打击乐。露天，而且正好在今晚降雨风险最高的那个小时。","i":"39896","eid":39896,"t":"Re-Charge","te":"Re-Charge","s":1260,"e":1320,"tl":"21:00-22:00","n":0,"nn":0},{"v":"Oulunkylän kirkko","ve":"Oulunkylä Church","a":"Teinintie 10, 00640 Helsinki, Suomi","la":60.23108,"ln":24.95975,"c":"Music","cs":["Musiikki"],"r":2,"d":"Night of the Arts Concert: John Coltrane’s A Love Supreme — A New Meditation\n\nThu 20.8. at 21:00 in Oulunkylä Church.\n\nJuhani ’Junnu’ Aaltonen: flute\n\nJazz Pastor Markku Salo: recitation\n\nPertti ’Pepa’ Päivinen: tenor saxophone and alto flute\n\nTapio Ylinen: guitars\n\nMusic arrangement and concept: Di …","df":"Taiteiden yön konsertti: John Coltranen A Love Supreme — Uusi Meditaatio\n\nto 20.8. klo 21 Oulunkylän kirkossa.\n\nJuhani ’Junnu’ Aaltonen: huilu, jazzpastori Markku Salo: lausunta, Pertti ’Pepa’ Päivinen: tenorisaksofoni ja alttohuilu, Tapio Ylinen: kitarat.\n\nMusiikin sovitus ja konsepti: Dimitri Grec …","u":"https://helsinkifestival.fi/taiteidenyo/event/konsertti-john-coltranen-a-love-supreme-uusi-meditaatio/","ue":"https://helsinkifestival.fi/taiteidenyo/en/event/concert-john-coltranen-a-love-supreme-uusi-meditaatio/","img":"https://helsinkifestival.fi/app/uploads/sites/14/2026/08/Facebook-tapahtuma-UUSI-KOKO-1920-x-1005-px-11-480x251.png?ver=fa36700a","io":"both","bk":0,"lim":0,"x":0,"op":0,"rr":1,"qe":"Coltrane's centenary year, in Dimitri Grechi Espinosa's new reading of A Love Supreme: Juhani 'Junnu' Aaltonen on flute, Pertti Paivinen on tenor, jazz pastor Markku Salo reciting. Free, programme booklet 10 EUR. But it is 6.7 km out in Oulunkyla, and going means writing off the centre.","qf":"Coltranen satavuotisvuosi ja Dimitri Grechi Espinosan uusi tulkinta A Love Supremesta: Juhani 'Junnu' Aaltonen huilulla, Pertti Päivinen tenorilla ja jazzpastori Markku Salo lausumassa. Vapaa pääsy, käsiohjelma 10 €. Mutta 6,7 kilometrin päässä Oulunkylässä — sinne lähteminen kuittaa koko keskustan pois.","qz":"Coltrane 百年，Dimitri Grechi Espinosa 重新诠释《A Love Supreme》：Juhani「Junnu」Aaltonen 长笛，Pertti Päivinen 次中音萨克斯，爵士牧师 Markku Salo 朗诵。免费，节目册 10 欧。但它在 6.7 公里外的 Oulunkylä，去了就等于把整个市中心一笔勾销。","i":"46109","eid":46109,"t":"Konsertti: John Coltranen A love Supreme - Uusi meditaatio","te":"Concert: John Coltranen A love Supreme - Uusi meditaatio","s":1260,"e":1320,"tl":"21:00-22:00","n":0,"nn":0},{"v":"Ravintola Pikku-Vallilan edessä","ve":"In front of Restaurant Pikku-Vallila","a":"Vallilantie 19, 00510 Helsinki, Suomi","la":60.1921,"ln":24.95905,"c":"Music","cs":["Ruoka & juoma","Musiikki"],"r":1,"d":"Tapsa Kojo sings songs about Helsinki and in the local Helsinki slang in front of Restaurant Pikku-Vallila. The performance takes place outdoors, free admission.","df":"Tapsa Kojo sjungaa stygejä Stadista ja stadiksi Ravintola Pikku-Vallilan edessä. Esitys on ulkona, vapaa pääsy.","u":"https://helsi const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const T0=720,T1=1560;                             /* 12:00 .. 02:00 */
const CATV={'Visual arts':['--c-visual-bg','--c-visual-ink'],'Music':['--c-music-bg','--c-music-ink'],
 'Dance':['--c-dance-bg','--c-dance-ink'],'Participate':['--c-part-bg','--c-part-ink'],
 'Literature':['--c-lit-bg','--c-lit-ink'],'Theatre':['--c-theatre-bg','--c-theatre-ink'],
 'Cinema':['--c-film-bg','--c-film-ink']};
const cv=c=>{const k=CATV[c]||CATV['Visual arts'];return `--cat-bg:var(${k[0]});--cat-ink:var(${k[1]})`};
const rv=r=>`--rk-bg:var(--r${r}-bg);--rk-ink:var(--r${r})`;
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=Object.fromEntries(EV.map(e=>[e.i,e]));
const PETALS=["M12 10L9.721 5.852A2.6 2.6 0 1 1 14.279 5.852Z",
 "M13.732 11L16.185 6.952A2.6 2.6 0 1 1 18.464 10.899Z",
 "M13.732 13L18.464 13.101A2.6 2.6 0 1 1 16.185 17.048Z",
 "M12 14L14.279 18.148A2.6 2.6 0 1 1 9.721 18.148Z",
 "M10.268 13L7.815 17.048A2.6 2.6 0 1 1 5.536 13.101Z",
 "M10.268 11L5.536 10.899A2.6 2.6 0 1 1 7.815 6.952Z"];
/* A <use> cannot be animated petal by petal from outside its shadow tree,
   so the hero button inlines the mark. */
const bloomHero=open=>open
  ? `<svg class="bi--bloom" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      ${PETALS.map(d=>`<g><path d="${d}"/></g>`).join('')}<circle cx="12" cy="12" r="1.4"/></svg>`
  : `<svg aria-hidden="true"><use href="#i-bloom-o"/></svg>`;
const wxAt=m=>WX.find(w=>w[0]===Math.min(26,Math.max(12,Math.floor(m/60))))||WX[0];

let justToggled=null;
/* Hours after midnight belong to the same evening, so 01:30 is 25:30. */
function nowMin(){const d=new Date();const m=d.getHours()*60+d.getMinutes();return m<300?m+1440:m}
const clampT=m=>Math.max(720,Math.min(1560,m));
let lang='en',T=clampT(nowMin()),mode='all',minRank=2,cats=new Set(),shelter='any',
    view='list',sel=null,openKey=null,query='',onlyOpen=false,onlyRare=false;
let plan=[];   /* [{i:sessionId, at:planned arrival in minutes}] */
try{
  const raw=JSON.parse(localStorage.getItem('ty26plan')||'[]');
  plan=raw.map(v=>typeof v==='string'?{i:v,at:(byId[v]||{}).s}:v)
          .filter(p=>p&&byId[p.i]).map(p=>({i:p.i,at:+p.at||byId[p.i].s}));
}catch(e){plan=[]}
try{const L=localStorage.getItem('ty26lang');if(STR[L])lang=L}catch(e){}
const savePlan=()=>{try{localStorage.setItem('ty26plan',JSON.stringify(plan))}catch(e){}};

/* copy helper: t('count',{a:3,b:9}) */
function t(key,vars){
  let s=STR[lang][key];
  if(s==null)s=STR.en[key]!=null?STR.en[key]:key;
  if(vars)Object.entries(vars).forEach(([k,v])=>{s=s.split('{'+k+'}').join(v)});
  return s;
}
const title=e=>lang==='fi'?e.t:(e.te||e.t);
const altTitle=e=>lang==='fi'?(e.te||''):(e.t!==e.te?e.t:'');
const venue=e=>lang==='fi'?e.v:(e.ve||e.v);
const desc=e=>lang==='fi'?(e.df||e.d):(e.d||e.df);
const note=e=>lang==='fi'?e.qf:lang==='zh'?e.qz:e.qe;
const catName=c=>(CATNAME[lang]||CATNAME.en)[c]||c;

/* ---------------- filtering ---------------- */
function passStatic(e){
  if(e.r<minRank)return false;
  if(onlyOpen&&!e.op)return false;
  if(onlyRare&&!e.rr)return false;
  if(cats.size&&!cats.has(e.c))return false;
  if(shelter==='in'&&e.io==='out')return false;
  if(shelter==='out'&&e.io==='in')return false;
  return true;
}
function passTime(e){
  if(mode==='all')return true;
  if(mode==='now')return e.s<=T&&e.e>T;
  return e.s>=T&&e.s<=T+45;
}
const fold=s=>String(s||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[ø]/g,'o').replace(/[æ]/g,'ae');
function matchesQuery(e){
  if(!query)return false;
  const hay=fold([e.t,e.te,e.v,e.ve,e.a,e.c,e.tl,e.d,e.df].join(' '));
  return fold(query).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
const visible=()=>view==='plan'
  ? plan.map(p=>byId[p.i]).filter(Boolean)
  : view==='search'
  ? EV.filter(matchesQuery)
  : EV.filter(e=>passStatic(e)&&passTime(e));

/* ---------------- map ---------------- */
const CARTO='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
const ESRI='Imagery &copy; Esri, Maxar, Earthstar Geographics';
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([60.1690,24.9530],14);
L.control.zoom({position:'topright'}).addTo(map);
const layers={
 voyager:L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
   {subdomains:'abcd',maxZoom:20,attribution:CARTO}),
 dark:L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png',
   {subdomains:'abcd',maxZoom:20,attribution:CARTO}),
 sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
   {maxZoom:19,attribution:ESRI}),
 satlab:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
   {maxZoom:19,attribution:''})
};
let base='map';
function isDark(){
  const a=document.documentElement.getAttribute('data-theme');
  if(a)return a==='dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyBase(){
  Object.values(layers).forEach(l=>map.hasLayer(l)&&map.removeLayer(l));
  if(base==='sat'){layers.sat.addTo(map);layers.satlab.addTo(map)}
  else (isDark()?layers.dark:layers.voyager).addTo(map);
  $('#segMap').setAttribute('aria-pressed',base==='map');
  $('#segSat').setAttribute('aria-pressed',base==='sat');
  $('.maptint').style.display=base==='sat'?'none':'';
}
$('#segMap').onclick=()=>{base='map';applyBase()};
$('#segSat').onclick=()=>{base='sat';applyBase()};

/* one marker per session, built once; only visibility changes afterwards */
const marks={};
EV.forEach(e=>{
  const size=e.r===3?46:e.r===2?38:e.r===1?29:12;
  const m=L.marker([e.la,e.ln],{
    icon:L.divIcon({html:markerHTML(e),className:'',iconSize:[size,size],iconAnchor:[size/2,size]}),
    zIndexOffset:e.r*1000,keyboard:false,riseOnHover:true});
  m.on('click',()=>openDetail(e.i,true));
  marks[e.i]=m;m.addTo(map);
});
function markerHTML(e){
  return `<span class="mk mk-r${e.r}">
    ${e.r>=2?'<span class="lab">'+esc(title(e).slice(0,36))+'</span>':''}
    <span class="bub">${e.r>0?'<svg><use href="#'+(e.r===3?'i-petal':'i-pin')+'"/></svg>':''}</span>
    <span class="stem"></span></span>`;
}
const planLayer=L.layerGroup().addTo(map);
function syncMarkers(){
  $('#map').dataset.close=map.getZoom()>=15?'1':'0';
  const on=new Set(visible().map(e=>e.i));
  EV.forEach(e=>{
    const icon=marks[e.i]._icon; if(!icon)return;
    const el=icon.firstElementChild; if(!el)return;
    el.dataset.on=on.has(e.i)?'1':'0';
    el.classList.toggle('sel',sel===e.i);
  });
  planLayer.clearLayers();
  if(view==='plan'&&plan.length>1){
    const pts=plan.map(p=>byId[p.i]).filter(Boolean).map(e=>[e.la,e.ln]);
    L.polyline(pts,{color:getComputedStyle(document.documentElement).getPropertyValue('--primary').trim(),
      weight:3,opacity:.85,className:'planline'}).addTo(planLayer);
  }
}
function relabelMarkers(){
  EV.forEach(e=>{const icon=marks[e.i]._icon;if(icon)icon.innerHTML=markerHTML(e)});
  syncMarkers();
}
function focusOn(e){
  const z=Math.max(map.getZoom(),16);
  const p=map.project([e.la,e.ln],z);
  const h=map.getSize().y;
  const lift=mobile()?h*0.26:0;        /* keep the pin above the sheet */
  map.setView(map.unproject(p.add(L.point(0,lift)),z),z,{animate:true});
}
function fitTo(list){
  const pts=list.filter(Boolean).map(e=>[e.la,e.ln]);
  if(!pts.length)return;
  if(pts.length===1)map.setView(pts[0],16,{animate:true});
  else map.fitBounds(L.latLngBounds(pts).pad(.2),{animate:true,maxZoom:16});
}

/* ---------------- timeline ---------------- */
function density(){
  const pool=EV.filter(e=>(!cats.size||cats.has(e.c))&&
    !(shelter==='in'&&e.io==='out')&&!(shelter==='out'&&e.io==='in'));
  const all=[],top=[];
  for(let m=T0;m<=T1;m+=5){
    const live=pool.filter(e=>e.s<=m&&e.e>m);
    all.push(live.length);top.push(live.filter(e=>e.r>=2).length);
  }
  return {all,top};
}
function area(vals,max,h,y0){
  const step=840/(vals.length-1);
  let d=`M0 ${y0}`;
  vals.forEach((v,i)=>{d+=`L${(i*step).toFixed(1)} ${(y0-(v/max)*h).toFixed(1)}`});
  return d+`L840 ${y0}Z`;
}
function drawTimeline(){
  const {all,top}=density(),max=Math.max(1,...all),H=44,BASE=32;
  let s='';
  s+=`<rect x="${SUNSET-T0}" y="0" width="${840-(SUNSET-T0)}" height="${H}" fill="var(--on-surface)" opacity=".07"/>`;
  WX.forEach(w=>{const x=w[0]*60-T0;if(x<-60||x>840)return;
    s+=`<rect x="${x}" y="0" width="60" height="${BASE}" fill="var(--c-dance-ink)" opacity="${(w[2]/100*.28).toFixed(3)}"/>`});
  for(let h=13;h<=26;h++){const x=h*60-T0;
    s+=`<line x1="${x}" y1="0" x2="${x}" y2="${BASE}" stroke="var(--outline-variant)" stroke-width="1"/>`}
  s+=`<path d="${area(all,max,BASE-5,BASE)}" fill="var(--on-surface)" opacity=".16"/>`;
  s+=`<path d="${area(top,max,BASE-5,BASE)}" fill="var(--r2)" opacity=".6"/>`;
  EV.filter(e=>e.r===3).forEach(e=>{const x=e.s-T0;if(x<0||x>840)return;
    s+=`<circle cx="${x}" cy="${BASE+5}" r="3.2" fill="var(--r3)"/>`});
  buildPlan().forEach(v=>{
    const x=Math.max(0,v.arrive-T0),w=Math.max(4,Math.min(v.depart,T1)-Math.max(v.arrive,T0));
    if(v.arrive-T0>840)return;
    s+=`<rect x="${x}" y="${BASE+11}" width="${w}" height="5" rx="2.5" fill="var(--primary)"/>`});
  const nx=clampT(nowMin())-T0;      /* where the evening actually is */
  if(nx>=0&&nx<=840)
    s+=`<line x1="${nx}" y1="0" x2="${nx}" y2="${H}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  const tx=Math.max(0,Math.min(840,T-T0));
  s+=`<line x1="${tx}" y1="0" x2="${tx}" y2="${H}" stroke="var(--on-surface)" stroke-width="2"/>`;
  s+=`<circle cx="${tx}" cy="5" r="5" fill="var(--on-surface)"/>`;
  const svg=$('#tlsvg');
  svg.innerHTML=s;
  svg.setAttribute('aria-valuenow',T);
  svg.setAttribute('aria-valuetext',fmt(T));
  if(!$('#tlTicks').childElementCount)
    $('#tlTicks').innerHTML=[12,14,16,18,20,22,24,26]
      .map(h=>`<span>${String(h%24).padStart(2,'0')}:00</span>`).join('');
}
let scrubbing=false;
function scrubFrom(x){
  const r=$('#tlTrack').getBoundingClientRect();
  setT(T0+Math.round(((x-r.left)/r.width)*840/5)*5);
}
$('#tlTrack').addEventListener('pointerdown',e=>{
  scrubbing=true;$('#tlTrack').setPointerCapture(e.pointerId);scrubFrom(e.clientX);e.preventDefault()});
$('#tlTrack').addEventListener('pointermove',e=>{if(scrubbing)scrubFrom(e.clientX)});
$('#tlTrack').addEventListener('pointerup',()=>scrubbing=false);
$('#tlTrack').addEventListener('pointercancel',()=>scrubbing=false);
$('#tlsvg').addEventListener('keydown',e=>{
  const step=e.shiftKey?60:15;
  if(e.key==='ArrowLeft'){setT(T-step);e.preventDefault()}
  if(e.key==='ArrowRight'){setT(T+step);e.preventDefault()}});
let tlOpen=false;                 /* starts as a pill, so the list gets the screen */
try{const v=localStorage.getItem('ty26tl');if(v!==null)tlOpen=v==='1'}catch(e){}
function setTimeline(open){
  tlOpen=open;

function walk(a,b){
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.la-a.la),dLn=rad(b.ln-a.ln);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.la))*Math.cos(rad(b.la))*Math.sin(dLn/2)**2;
  return Math.max(2,Math.round(2*R*Math.asin(Math.sqrt(h))/75)+2);   /* 75 m/min + friction */
}
/* A stop is a visit, not the whole run of the event.
   A fixed performance ends when it ends and you plan around that.
   An open-all-evening venue is elastic: you stay until you have to leave for
   the next stop, so the only thing that can go wrong is having no time there. */
const FLEXIBLE=75;                                    /* longer than this is a venue you drop into, not a show you sit through */
function buildPlan(){
  const stops=plan.map(p=>({p,e:byId[p.i]})).filter(x=>x.e)
                  .sort((a,b)=>a.p.at-b.p.at||a.e.s-b.e.s);
  stops.forEach((v,k)=>{
    const e=v.e,next=stops[k+1];
    v.flex=(e.e-e.s)>FLEXIBLE;
    v.arrive=v.p.at;
    v.walkNext=next?walk(e,next.e):0;
    const mustLeave=next?next.p.at-v.walkNext:Infinity;
    v.depart=v.flex
      ? Math.max(v.arrive,Math.min(e.e,mustLeave===Infinity?Math.min(e.e,v.arrive+90):mustLeave))
      : e.e;
    v.stay=Math.max(0,v.depart-Math.max(v.arrive,e.s));
    v.missed=v.arrive>=e.e;
    v.early=v.arrive<e.s;
  });
  stops.forEach((v,k)=>{
    if(!k){v.walk=0;v.slack=null;return}
    const prev=stops[k-1];
    v.walk=prev.walkNext;
    v.slack=prev.flex?null:v.arrive-(prev.e.e+v.walk);   /* only a fixed show can be cut short */
  });
  return stops;
}
function renderPlan(){
  plan=plan.filter(p=>byId[p.i]).sort((a,b)=>a.at-b.at);savePlan();
  const items=buildPlan();
  $('#sheetTitle').textContent=t('myPlan');
  $('#sheetSub').textContent=items.length?t('stops',{n:items.length}):t('nothingSaved');
  $('#backBtn').hidden=false;$('#clearPlan').hidden=!items.length;
  let body=`<div class="group-h" style="${rv(3)}"><i></i><b>${t('routes')}</b><span>${t('routesSub')}</span></div>
    <div class="presets">`+PRESETS.map((p,k)=>{
      const c=p[lang]||p.en;
      return `<button class="preset" data-preset="${k}" style="${rv(p.r)}">
        <span class="pi"><svg><use href="#i-route"/></svg></span>
        <span class="pt"><b>${esc(c.n)}</b><span>${esc(c.d)}</span></span></button>`}).join('')+`</div>`;
  if(items.length){
    body+=`<div class="group-h" style="${rv(2)}"><i></i><b>${t('inOrder')}</b>
      <span>${fmt(items[0].arrive)}–${fmt(items[items.length-1].depart)}</span></div><div class="rows">`;
    items.forEach((v,k)=>{
      if(k){
        const w=v.walk,s=v.slack;
        const bad=s!==null&&s<0;
        const txt=s===null?t('walkOnly',{w})
                :s>0?t('walkSpare',{w,g:s})
                :s<0?t('walkShort',{w,g:-s}):t('walkTight',{w});
        body+=`<div class="leg ${bad?'bad':''}"><svg><use href="#${bad?'i-warn':'i-walk'}"/></svg>
          <span>${txt}</span></div>`;
      }
      const thin=!v.missed&&v.flex&&v.stay<20;
      const hint=v.missed?t('tooLate')
        :v.early?t('wait',{g:v.e.s-v.arrive})
        :v.flex?(thin?t('shortStay',{n:v.stay}):t('stay',{n:v.stay}))
        :t('ends',{t:fmt(v.depart)});
      body+=`<div class="plan-item"><span class="num">${k+1}</span>${rowHTML(v.e)}
        <div class="at ${v.missed||thin?'bad':''}" style="${rv(v.e.r)}">
          <span class="lb">${t('arriveAt')}</span>
          <button data-at="${v.p.i}" data-d="-15" aria-label="-15">&minus;</button>
          <b>${fmt(v.arrive)}</b>
          <button data-at="${v.p.i}" data-d="15" aria-label="+15">+</button>
          <span class="hint">${hint}</span>
        </div></div>`;
    });
    body+='</div>';
  }
  $('#sbody').innerHTML=body;
}

  openKey=k;$('#fTitle').textContent=FILTERS[k].title();
  $('#fbody').innerHTML=FILTERS[k].render();
  $('#fsheet').classList.add('show');$('#scrim').classList.add('show');
}
function closeSheet(){$('#fsheet').classList.remove('show');$('#scrim').classList.remove('show')}
$$('[data-sheet]').forEach(p=>p.onclick=()=>openSheet(p.dataset.sheet));
$('#langBtn').onclick=()=>openSheet('lang');
$('#scrim').onclick=closeSheet;$('#applyBtn').onclick=closeSheet;
$('#clearSheet').onclick=()=>{
  if(openKey==='rank')minRank=2;
  if(openKey==='type')cats.clear();
  if(openKey==='where')shelter='any';
  if(openKey==='when')mode='now';
  if(openKey==='special'){onlyOpen=false;onlyRare=false}
  openSheet(openKey);syncPills();render();
};
$('#fbody').addEventListener('click',ev=>{
  const b=ev.target.closest('.opt');if(!b)return;
  if(b.dataset.rank!==undefined)minRank=+b.dataset.rank;
  if(b.dataset.cat){cats.has(b.dataset.cat)?cats.delete(b.dataset.cat):cats.add(b.dataset.cat)}
  if(b.dataset.shelter)shelter=b.dataset.shelter;
  if(b.dataset.only==='open')onlyOpen=!onlyOpen;
  if(b.dataset.only==='rare')onlyRare=!onlyRare;
  if(b.dataset.when)mode=b.dataset.when;
  if(b.dataset.lang){lang=b.dataset.lang;applyLang()}
  if(b.dataset.theme){setTheme(b.dataset.theme)}
  if(view==='detail'&&!b.dataset.lang){view='list';sel=null}
  openSheet(openKey);syncPills();render();
});
function syncPills(){
  $('#rankLbl').textContent=t('rankPill')[minRank];
  $('[data-sheet="rank"]').dataset.active=minRank>0;
  $('#whenLbl').textContent=t(mode==='now'?'onNow':mode==='soon'?'soon':'all');
  $('[data-sheet="when"]').dataset.active=mode!=='all';
  const ty=$('[data-sheet="type"]');ty.dataset.active=cats.size>0;
  const n=$('.n',ty);n.hidden=!cats.size;n.textContent=cats.size;
  $('[data-sheet="where"]').dataset.active=shelter!=='any';
  $('#specialLbl').textContent=t('special');
  const sp=$('[data-sheet="special"]'),spn=(onlyOpen?1:0)+(onlyRare?1:0);
  sp.dataset.active=spn>0;
  const spb=$('.n',sp);spb.hidden=!spn;spb.textContent=spn;
  $('#themeLbl').textContent=t(isDark()?'dark':'light');
  $('#themeIcon').innerHTML=`<use href="#${isDark()?'i-moon':'i-sun'}"/>`;
}
$('#themePill').onclick=()=>setTheme(isDark()?'light':'dark');
function setTheme(v){
  document.documentElement.setAttribute('data-theme',v);
  try{localStorage.setItem('ty26theme',v)}catch(e){}
  applyBase();syncPills();if(tlOpen)drawTimeline();
}

/* ---------------- sheet drag (mobile only) ---------------- */
const sheet=$('#sheet'),grab=$('#grab'),sbody=$('#sbody');
let snaps=[],snapIdx=1,dragging=false,startY=0,startTop=0,lastY=0,lastT=0,vel=0;
const mobile=()=>window.matchMedia('(max-width:900px)').matches;
function calcSnaps(){
  const h=window.innerHeight,tl=$('.timeline').offsetHeight;
  snaps=[Math.max(200,Math.round(h-tl-116)),Math.round(h*0.44),72];
}
function setSnap(i,animate=true){
  if(!mobile()){sbody.classList.remove('locked');return}
  calcSnaps();snapIdx=Math.max(0,Math.min(2,i));
  sheet.classList.toggle('dragging',!animate);
  sheet.style.setProperty('--y',snaps[snapIdx]+'px');
  sbody.classList.toggle('locked',snapIdx===0);
  if(!animate)requestAnimationFrame(()=>sheet.classList.remove('dragging'));
}
grab.addEventListener('pointerdown',e=>{
  if(!mobile()||e.target.closest('button,input,.searchbar'))return;
  calcSnaps();dragging=true;sheet.classList.add('dragging');
  startY=e.clientY;startTop=parseFloat(sheet.style.getPropertyValue('--y'))||snaps[1];
  lastY=e.clientY;lastT=performance.now();vel=0;grab.setPointerCapture?.(e.pointerId)});
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const now=performance.now();vel=(e.clientY-lastY)/Math.max(1,now-lastT);
  lastY=e.clientY;lastT=now;
  sheet.style.setProperty('--y',Math.max(snaps[2]-16,Math.min(snaps[0]+70,startTop+e.clientY-startY))+'px');
  e.preventDefault()},{passive:false});
function endDrag(){
  if(!dragging)return;dragging=false;sheet.classList.remove('dragging');
  const y=parseFloat(sheet.style.getPropertyValue('--y'));
  let target;
  if(vel<-0.55)target=snapIdx===0?1:2;
  else if(vel>0.55)target=snapIdx===2?1:0;
  else target=snaps.indexOf(snaps.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a));
  setSnap(target);
}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
grab.addEventListener('click',e=>{
  if(!e.target.closest('button')&&Math.abs(vel)<.05&&snapIdx<2)setSnap(snapIdx+1)});
sbody.addEventListener('pointerdown',e=>{sbody.dataset.top=sbody.scrollTop<=0?e.clientY:''});
sbody.addEventListener('pointermove',e=>{
  if(sbody.dataset.top&&e.clientY-(+sbody.dataset.top)>26&&snapIdx===2){sbody.dataset.top='';setSnap(1)}});
sbody.addEventListener('pointerup',()=>sbody.dataset.top='');
window.addEventListener('resize',()=>{measureChrome();setSnap(snapIdx)});

/* ---------------- boot ---------------- */
try{const th=localStorage.getItem('ty26theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
applyBase();applyLang();setTimeline(tlOpen);setSnap(1,false);render();
map.whenReady(()=>setTimeout(()=>{map.invalidateSize();syncMarkers()},80));
map.on('zoomend',syncMarkers);
</script>
</body>
